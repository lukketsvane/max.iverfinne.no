    case 'fly':
    case 'approach':
      var dist = (c.tx - c.x) * c.face;
      var gT = surfaceY(c.tx);
      if (c.st === 'fly') {
        var want = Math.max(-30, Math.min(20, (c.cruise - c.y) * 1.6));
        c.vx += (c.face * 50 - c.vx) * 1.8 * dt;
        if (c.seq === 'glide') {
          c.vy += (7 - c.vy) * 2.0 * dt;
          c.fr = CR_GLIDE;
          c.flapT -= dt;
          if (c.flapT <= 0 || c.y > c.cruise + 10) { crowSeq(c, 'fly'); c.flapT = 0.8 + Math.random() * 1.2; }
        } else {
          c.vy += (want - c.vy) * 2.4 * dt;
          crowTick(c, dt, true);
          c.flapT -= dt;
          if (c.flapT <= 0 && Math.abs(c.cruise - c.y) < 9 && c.fi === 3) { c.seq = 'glide'; c.flapT = 0.4 + Math.random() * 0.7; }
        }
        if (dist < (gT - c.y) * 1.7 + 18) { c.st = 'approach'; if (c.seq !== 'fly') crowSeq(c, 'fly'); }
      } else {
        if (waterAt(c.tx)) c.tx = dryX(c.tx);
        var spd = Math.max(16, Math.min(50, dist * 1.5));
        c.vx += (c.face * spd - c.vx) * 3.0 * dt;
        var T = Math.max(0.2, dist / Math.max(14, Math.abs(c.vx)));
        var vyW = Math.max(-20, Math.min(56, (gT - 6 - c.y) / T));
        c.vy += (vyW - c.vy) * 3.2 * dt;
        if (vyW < 4 || c.seq === 'fly' && c.fi !== 3) { if (c.seq !== 'fly') crowSeq(c, 'fly'); crowTick(c, dt, true); }
        else { c.seq = 'glide'; c.fr = CR_GLIDE; }
        if (dist < -6) { c.face = -c.face; }
        var g0 = surfaceY(c.x);
        if (c.y >= g0 - 7 || dist < 5) { c.st = 'flare'; crowSeq(c, 'flare'); }
      }
      c.x += c.vx * dt; c.y += c.vy * dt;
      break;

    case 'flare':
      crowTick(c, dt, false);
      c.vx *= Math.exp(-5.5 * dt);
      c.vy += (22 - c.vy) * 6 * dt;
      c.x += c.vx * dt; c.y += c.vy * dt;
      var wl = waterAt(c.x);
      if (wl) { c.st = 'fly'; crowSeq(c, 'fly'); c.tx = wl.cx + c.face * (wl.hw + 24); c.cruise = wl.level - 20; c.vy = -24; break; }
      var g1 = surfaceY(c.x);
      if (c.y >= g1) {
        c.y = g1; c.vx = 0; c.vy = 0; c.st = 'settle'; crowSeq(c, 'settle');
        puff(c.x, g1, 1, 0.25);
      }
      break;

    case 'settle':
      crowTick(c, dt, false);
      c.y = surfaceY(c.x);
      if (c.done) { crowStand(c, 0.8 + Math.random() * 1.6); c.fi = 0; c.hold = 0.5; }
      break;
    }
  }
}

function drawCrowCell(img, fr, sx, sy, face) {
  var col = fr & 7, row = fr >> 3;
  if (face < 0) {
    ctx.save(); ctx.translate(sx + CAX + 1, sy - CAY); ctx.scale(-1, 1);
    ctx.drawImage(img, col * CW, row * CH, CW, CH, 0, 0, CW, CH);
    ctx.restore();
  } else ctx.drawImage(img, col * CW, row * CH, CW, CH, sx - CAX, sy - CAY, CW, CH);
}

function drawCrows() {
  if (!crowReady) return;
  for (var i = 0; i < crows.length; i++) {
    var c = crows[i];
    var sx = Math.round(c.x - camX), sy = Math.round(c.y - camY);
    if (sx < -24 || sx > IW + 24) continue;
    var gy = Math.round(surfaceY(c.x) - camY);
    var lift = Math.max(0, Math.min(1, (gy - sy) / 40));
    var w = Math.round(6 - lift * 4);
    if (gy > -4 && gy < IH + 4 && w > 1) {
      ctx.fillStyle = 'rgba(10,14,10,' + (0.34 - lift * 0.26).toFixed(2) + ')';
      ctx.fillRect(sx - (w >> 1), gy + 1, w, 1);
    }
    drawCrowCell(crowImg, c.fr, sx, sy, c.face);
  }
}

      if (s.x < p.cx - lim) { s.x = p.cx - lim; s.face = 1; }
      s.y = p.level + Math.sin(tSec * 1.3 + s.bob) * 0.5;
      if (s.actT <= 0) {
        var r = Math.random();
        if (s.kind === 'white' && r < 0.3) { s.st = 'dive'; setSW(s, 'dive'); }
        else if (s.kind === 'white' && r < 0.44) { s.st = 'flap'; setSW(s, 'flap'); ripple(s.x, p.level, 'ring'); }
        else if (r < 0.66) s.face = -s.face;
        s.actT = 3.5 + Math.random() * 5;
      }
      var d = Math.abs(s.x - P.x), w = waterAt(P.x);
      var alarm = (d < 44 && (Math.abs(P.vx) > 45 || !P.grounded)) || (w === p && d < 76);
      if (alarm && s.calm <= 0) {
        if (s.kind === 'white') swanTakeOff(s, s.x < P.x ? -1 : 1);
        else { s.flee = 2.5; s.face = s.x < P.x ? -1 : 1; }
      }
    } else if (s.st === 'dive' || s.st === 'flap') {
      s.y = p.level;
      if (s.anim === 'dive' && s.frame === 6 && !s.splashed) { ripple(s.x, p.level, 'splash'); s.splashed = true; }
      if (s.done) { s.st = 'swim'; s.splashed = false; setSW(s, 'swim'); }
    } else if (s.st === 'take') {                           // run across the water, then lift
      s.vx += (s.face * 60 - s.vx) * 1.5 * dt;
      s.x += s.vx * dt;
      if (s.frame >= 5) { s.vy += (-44 - s.vy) * 2.4 * dt; s.y += s.vy * dt; }
      else if (Math.random() < dt * 9) ripple(s.x - s.face * 6, p.level, 'ring');
      if (s.done) { s.st = 'fly'; setSW(s, 'fly'); }
    } else if (s.st === 'fly' || s.st === 'glide') {
      var tg = s.target, cruise = (tg ? Math.min(tg.level, p.level) : p.level) - 78;
      s.vx += (s.face * 64 - s.vx) * 1.3 * dt;
      s.vy += (((s.y > cruise) ? -30 : 8) - s.vy) * 1.8 * dt;
      s.x += s.vx * dt; s.y += s.vy * dt;
      if (tg && s.face * (s.x - tg.cx) > -tg.hw * 1.6) { s.st = 'land'; setSW(s, 'glide'); }
      if (!tg && Math.abs(s.x - P.x) > IW * 1.6) { swans.splice(i, 1); continue; }
    } else if (s.st === 'land') {                           // glide down onto the next pond
      var tp = s.target;

      var aim = tp.cx + s.face * tp.hw * 0.25;      var left = Math.max(12, s.face * (aim - s.x));
      s.vy = Math.max(-8, Math.min(60, (tp.level - s.y) * Math.abs(s.vx) / left));
      s.x += s.vx * dt; s.y += s.vy * dt;
      if (s.y >= tp.level - 0.5) {
        var fromP=s.pond;
        s.y = tp.level; s.pond = tp; s.st = 'settle'; setSW(s, 'settle');
        if(fromP!==tp&&!pondHasSwans(fromP))retirePond(fromP,28);
        tp.pop=true;tp.gone=0;
        ripple(s.x, tp.level, 'splash'); s.calm = 4;
      }
    } else if (s.st === 'settle') {                          // take-off played backwards: wings fold
      s.vx *= Math.pow(0.08, dt); s.x += s.vx * dt;
      s.x = Math.max(s.pond.cx - s.pond.hw + 15, Math.min(s.pond.cx + s.pond.hw - 15, s.x));
      if (s.done) { s.st = 'swim'; setSW(s, 'swim'); s.actT = 2 + Math.random() * 3; }
    }

    var a = SWA[s.anim];
    var rate = a.fps;
    if (s.anim === 'swim') rate = (s.flee > 0 ? 11 : a.fps);
    s.clock += dt * rate;
    while (s.clock >= 1) {
      s.clock -= 1;
      if (s.frame < a.n - 1) s.frame++;
      else if (a.loop) s.frame = 0; else s.done = true;
    }
  }
  for (var r2 = swanRipples.length - 1; r2 >= 0; r2--) {
    var q = swanRipples[r2]; q.t += dt; if (q.t >= q.life) swanRipples.splice(r2, 1);
  }
}

function drawSwanCell(row, col, x, y, face) {
  var sx = Math.round(x - camX), sy = Math.round(y - camY);
  if (sx < -40 || sx > IW + 40 || sy < -40 || sy > IH + 40) return;
  var dx = sx - SWC.ax, dy = sy - SWC.wl;
  if (face < 0) {
    ctx.save(); ctx.translate(dx + SWC.w, dy); ctx.scale(-1, 1);
    ctx.drawImage(swanImg, col * SWC.w, row * SWC.h, SWC.w, SWC.h, 0, 0, SWC.w, SWC.h);
    ctx.restore();
  } else ctx.drawImage(swanImg, col * SWC.w, row * SWC.h, SWC.w, SWC.h, dx, dy, SWC.w, SWC.h);
}

/* reeds, lily pads, a floating feather, now and then a nest on the bank */
function pondDeco(p) {
  if (p.deco) return p.deco;
  var d = [], b = p.b;
  function add(row, col, x, y, front) { d.push({ row: row, col: col, x: x, y: y, front: !!front, ph: h2(b, d.length) * 6.28 }); }
  for (var side = -1; side <= 1; side += 2) {
    var n = 2 + ((h2(b, side + 5) * 3) | 0);
    for (var k = 0; k < n; k++) {
      var rx = p.cx + side * (p.hw - 3 - k * 7 - h2(b, k + side * 9) * 5);
      add(h2(b, k + 40 + side) > 0.5 ? 6 : 7, h2(b, k + 40 + side) > 0.5 ? 8 : 5, rx, p.level, k === 0 && side > 0);
    }
  }
  var pads = 2 + ((h2(b, 21) * 3) | 0);
  for (var j = 0; j < pads; j++) {
    var px = p.cx + (h2(b, j + 60) - 0.5) * p.hw * 1.5, pick = (h2(b, j + 70) * 3) | 0;
    add(pick === 2 ? 7 : 6, pick === 0 ? 6 : (pick === 1 ? 7 : 3), px, p.level);
  }
  if (h2(b, 80) > 0.5) add(7, 4, p.cx + (h2(b, 81) - 0.5) * p.hw, p.level);           // water lily
  if (h2(b, 82) > 0.62) add(7, 0, p.cx + (h2(b, 83) - 0.5) * p.hw * 1.2, p.level);    // feather
  if (h2(b, 84) > 0.72) { var nx = p.cx + (h2(b, 85) > 0.5 ? 1 : -1) * (p.hw + 16); add(7, 2, nx, surfaceY(nx)); }
  if (h2(b, 86) > 0.5)  { var rx2 = p.cx + (h2(b, 87) > 0.5 ? 1 : -1) * (p.hw + 6); add(7, 6, rx2, surfaceY(rx2) + 1); }
  p.deco = d;
  return d;
}

var WATER = { body: 'rgba(24,27,46,0.86)', deep: 'rgba(17,19,34,0.9)', top: '#3e4466', shine: '#5a6488' };
function drawWater(t) {
  var cyr = Math.round(camY);
  pondsInView(function (p) {
    var L = Math.round(p.level) - cyr;
    var x0 = Math.max(0, Math.floor(p.cx - p.hw - camX)), x1 = Math.min(IW, Math.ceil(p.cx + p.hw - camX) + 1);
    for (var sx = x0; sx < x1; sx++) {
      var g = Math.round(surf[sx + 5]) - cyr;
      if (g <= L) continue;
      ctx.fillStyle = WATER.body; ctx.fillRect(sx, L, 1, g - L);
      if (g - L > 5) { ctx.fillStyle = WATER.deep; ctx.fillRect(sx, L + 3, 1, g - L - 3); }
      var wx = Math.round(camX) + sx;
      ctx.fillStyle = (Math.sin(t * 1.6 + wx * 0.45) > 0.72) ? WATER.shine : WATER.top;
      ctx.fillRect(sx, L, 1, 1);
    }
    // the moon, broken up on the surface
    var span = IW + 900, mx = (IW * 0.72 - camX * 0.012) % span; if (mx < -60) mx += span;
    if (mx > x0 + 3 && mx < x1 - 3) {
      for (var k = 0; k < 4; k++) {
        var w = 5 - k, off = Math.round(Math.sin(t * 2.1 + k * 1.9) * 1.2);
        ctx.fillStyle = 'rgba(223,230,234,' + (0.55 - k * 0.11).toFixed(2) + ')';
        ctx.fillRect(Math.round(mx - w / 2) + off, L + 1 + k * 2, w, 1);
      }
    }
  });
}
function drawPondDeco(front) {
  if (!swanReady) return;
  pondsInView(function (p) {
    var d = pondDeco(p);
    for (var i = 0; i < d.length; i++) {
      var e = d[i]; if (e.front !== front) continue;
      var bob = (e.row === 6 && e.col < 8) || (e.row === 7 && (e.col === 3 || e.col === 4 || e.col === 0)) ? Math.round(Math.sin(tSec * 1.1 + e.ph) * 0.6) : 0;
      drawSwanCell(e.row, e.col, e.x, e.y + bob, 1);
    }
  });
}
function drawSwans() {
  if (!swanReady) return;
  for (var i = 0; i < swanRipples.length; i++) {
    var q = swanRipples[i], f = q.t / q.life, col;
    if (q.kind === 'splash') col = 2 + Math.min(3, (f * 4) | 0);
    else col = f < 0.5 ? 0 : 5;
    drawSwanCell(6, col, q.x, q.y, 1);
  }
  for (var j = 0; j < swans.length; j++) {
    var s = swans[j];
    if (s.kind === 'cyg') { drawSwanCell(5, s.big ? 1 : 0, s.x, s.y, s.face); continue; }
    if (s.kind === 'black') { drawSwanCell(5, 2, s.x, s.y, s.face); continue; }
    var a = SWA[s.anim], fr = a.rev ? a.n - 1 - s.frame : s.frame;
    if (s.st === 'fly' || s.st === 'glide' || s.st === 'land' || (s.st === 'take' && s.frame >= 5)) {
      var gy = Math.round(surfaceY(s.x) - camY), w = waterAt(s.x);
      if (w) gy = Math.round(w.level - camY);
      var lift = Math.max(0, Math.min(1, (gy - (s.y - camY)) / 80)), sw = Math.round(14 - lift * 8);
      if (sw > 2 && gy < IH) { ctx.fillStyle = 'rgba(8,10,16,' + (0.3 - lift * 0.2).toFixed(2) + ')'; ctx.fillRect(Math.round(s.x - camX) - (sw >> 1), gy, sw, 1); }
    }
    drawSwanCell(a.row, fr, s.x, s.y, s.face);
  }
}

/* now and then a pair or three swans cross high over the garden */
var swanSky = [], swanSkyT = 20 + Math.random() * 30, swanSkyClock = 0;
function updateSwanSky(dt) {
  swanSkyClock += dt;
  if (!swanSky.length) {
    swanSkyT -= dt;
    if (swanSkyT <= 0) {
      var dir = Math.random() < 0.5 ? 1 : -1, n = 2 + ((Math.random() * 2) | 0), y0 = Math.max(10, HY - 176) + Math.random() * Math.min(40, Math.max(6, HY - 80));
      for (var i = 0; i < n; i++) swanSky.push({ x: dir > 0 ? -60 - i * 30 : IW + 60 + i * 30, y: y0 + i * 7,
        vx: dir * (30 + Math.random() * 4), ph: i * 2.3, dir: dir });
      swanSkyT = 70 + Math.random() * 80;
    }
  } else {
    for (var j = swanSky.length - 1; j >= 0; j--) {
      var f = swanSky[j]; f.x += f.vx * dt; f.y += Math.sin(swanSkyClock * 0.6 + f.ph) * 3 * dt;
      if (f.dir > 0 ? f.x > IW + 70 : f.x < -70) swanSky.splice(j, 1);
    }

}
function drawSwanSky() {
  if (!swanReady || !swanSky.length) return;
  ctx.globalAlpha = 0.8;
  for (var i = 0; i < swanSky.length; i++) {
    var f = swanSky[i], fr = ((swanSkyClock * 7 + f.ph * 3) | 0) % 8;
    drawSwanCell(4, fr, f.x + camX, f.y + camY, f.dir);
  }
  ctx.globalAlpha = 1;
}

function gRect(r, dx, dy, flip) {
  if (flip) {
    ctx.save(); ctx.translate(dx + r[2], dy); ctx.scale(-1, 1);
    ctx.drawImage(gardenImg, r[0], r[1], r[2], r[3], 0, 0, r[2], r[3]);
    ctx.restore();
  } else ctx.drawImage(gardenImg, r[0], r[1], r[2], r[3], dx, dy, r[2], r[3]);
}
/* a ground sprite whose top part leans by whole pixels */
function gPlant(r, sx, gy, lean, flip) {
  var w = r[2], h = r[3], dx = sx - (w >> 1), top = gy - h;
  var cut = Math.round(h * 0.45);                     // upper 45% moves, the base stays planted
  if (!lean) { gRect(r, dx, top, flip); return; }
  ctx.save(); ctx.beginPath(); ctx.rect(dx - 4, top + cut, w + 8, h - cut); ctx.clip();
  gRect(r, dx, top, flip); ctx.restore();
  ctx.save(); ctx.beginPath(); ctx.rect(dx - 4 + lean, top - 1, w + 8, cut + 1); ctx.clip();
  gRect(r, dx + lean, top, flip); ctx.restore();
}
function brush(wx, reach) {                            // how hard Max is pushing this plant over
  var d = wx - P.x;
  if (Math.abs(d) > reach || Math.abs(P.vx) < 4 || P.y < surfaceY(wx) - 20) return 0;
  return (P.vx > 0 ? 1 : -1) * (1 - Math.abs(d) / reach);
}
function dryGround(wx, pad) { var p = pondNear(wx); return !(p && Math.abs(wx - p.cx) < p.hw + pad); }

/* ---- stacked Figma plants ---- */
function figmaSeg(r, cx, yb, flip) {
  var dx = cx - (r[2] >> 1), dy = yb - r[3];
  if (flip) {
    ctx.save(); ctx.translate(dx + r[2], dy); ctx.scale(-1, 1);
    ctx.drawImage(r.img, 0, 0, r[2], r[3], 0, 0, r[2], r[3]);
    ctx.restore();
  } else ctx.drawImage(r.img, 0, 0, r[2], r[3], dx, dy, r[2], r[3]);
}
/* ---- the 99 Figma plant components -------------------------------------
   8 families (plant_1..plant_8), 81 stem pieces and 18 flower heads, each a
   7 px high slice of a plant. Every run of 9 buckets along the path holds
   one plant of each family (two of plant_1, the biggest), in a shuffled
   order, and each family deals out its pieces from a fixed partition:
   consecutive plants of a family use disjoint runs of stems and flowers,
   so a full cycle shows every one of the 99 pieces exactly once. A cycle
   spans two blocks, so any 700 px of path shows all 99 and any single
   540 px screen at least 89 of them. */
var FAM_CYCLE = [
  { s: [6, 3, 8, 2], f: [2, 3, 2, 2] },   // plant_1: 19 stems, 9 flowers
  { s: [5, 6],       f: [1, 2] },         // plant_2: 11 / 3
  { s: [3, 4],       f: [1, 1] },         // plant_3: 7 / 2
  { s: [3, 5],       f: [1, 1] },         // plant_4: 8 / 2
  { s: [2, 3],       f: [1, 2] },         // plant_5 arches: 5 / 3
  { s: [4, 6],       f: [1, 1] },         // plant_6: 10 / 2
  { s: [3, 4],       f: [2, 3] },         // plant_7 starbursts: 7 / 5
  { s: [1, 2],       f: [1, 2] }          // plant_8 twig + puff: 3 / 3
];
var FIG_BW = 24, FIG_SLOTS = [0, 0, 1, 2, 3, 4, 5, 6, 7];
function famPieces(fi, k) {
  var cy = FAM_CYCLE[fi], L = cy.s.length, c = ((k % L) + L) % L, round = Math.floor(k / L);
  var fam = PA.fam[fi], NS = fam.s.length, NF = fam.f.length;
  var s0 = 0, f0 = 0;
  for (var i = 0; i < c; i++) { s0 += cy.s[i]; f0 += cy.f[i]; }
  var st = [], fl = [];
  for (i = 0; i < cy.s[c]; i++) st.push(fam.s[(s0 + i) % NS]);
  for (i = 0; i < cy.f[c]; i++) fl.push(fam.f[(f0 + i) % NF]);
  if (round & 1) st.reverse();                 // same pieces, a different plant each time round
  if (round % 3 === 2) st.push(st.shift());
  return { st: st, fl: fl };
}
function figSlot(b) {                         // family and per-family ordinal for bucket b
  var blk = Math.floor(b / 9), j = b - blk * 9;
  var order = FIG_SLOTS.slice();
  for (var i = 8; i > 0; i--) { var r = (h1(blk * 13.1 + i * 1.7) * (i + 1)) | 0, tmp = order[i]; order[i] = order[r]; order[r] = tmp; }
  var fi = order[j], k = blk;
  if (fi === 0) { var first = order.indexOf(0); k = blk * 2 + (j === first ? 0 : 1); }
  return { fi: fi, k: k };
}
function drawTallFigma(b, fi, k, sx, gy, t, wx) {
  var pc = famPieces(fi, k), st = pc.st, fl = pc.fl;
  var push = brush(wx, 16);
  var phase = t * (0.5 + h1(b) * 0.4) + b * 1.7;
  if (fi === 4) {                                          // arches stand side by side, the bloom beside them
    for (var a = 0; a < st.length; a++) figmaSeg(st[a], sx + a * 7 * (b & 1 ? 1 : -1), gy + 1, (a + b) & 1);
    for (a = 0; a < fl.length; a++) figmaSeg(fl[a], sx + 3 + a * 5, gy + 1, b & 1);
    return;
  }
  var segs = st.concat(fl), total = segs.length, yb = gy + 1;
  for (var i = 0; i < total; i++) {
    var r = segs[i];
    var q = total > 1 ? i / (total - 1) : 0;
    var lean = Math.round((Math.sin(phase) * 1.3 * q * q) + push * 3 * q * q);
    figmaSeg(r, sx + lean, yb, ((i + b) & 1) === 1);
    yb -= r[3];
  }
}

/* ---- sprites from the big sheet, placed in buckets along the path ---- */
function pick(list, v) { return list[Math.min(list.length - 1, (v * list.length) | 0)]; }
function drawLowFlora(t, front) {
  if(!WILD_PLANTS)return;
  if (!gardenReady) return;
  var cyr = Math.round(camY), B = front ? 71 : 19;
  var b0 = Math.floor((camX - 30) / B), b1 = Math.floor((camX + IW + 30) / B);
  for (var b = b0; b <= b1; b++) {
    var seed = front ? b * 5.77 + 91 : b * 2.13;
    if (h1(seed) > (front ? 0.36 : 0.52)) continue;
    var wx = b * B + Math.round(h1(seed + 0.7) * (B - 6));
    if (!dryGround(wx, 6)) continue;
    var sx = Math.round(wx - camX), gy = Math.round(surfaceY(wx)) - cyr;
    if (sx < -20 || sx > IW + 20 || gy < -40 || gy > IH + 20) continue;
    var v = h1(seed + 3.3), r;
    if (front) r = v < 0.7 ? pick(GM.grass, h1(seed + 5)) : pick(GM.bush, h1(seed + 5));
    else if (v < 0.5) r = pick(GM.grass, h1(seed + 5));
    else if (v < 0.66) r = pick(GM.sprout, h1(seed + 5));
    else if (v < 0.88) r = pick(GM.bush, h1(seed + 5));
    else r = pick(GM.posy, h1(seed + 5));
    var lean = Math.round(Math.sin(t * 0.9 + b * 1.3) * 0.6 + brush(wx, 10) * 2);

}
function drawTallFlora(t) {
  if(!WILD_PLANTS)return;

/* ---------------------------------------------------------------- FUGLESPRENGER

   Long-press still uses the slower social interaction system. */
var birdBlasts=[], birdFeathers=[], blastScore=0, blastCombo=0, blastComboT=0;

function setBlastHud(){

    var now=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
    o.type='square';o.frequency.setValueAtTime(115+chain*18,now);o.frequency.exponentialRampToValueAtTime(44,now+.11);
    g.gain.setValueAtTime(.055*effectsVolume,now);g.gain.exponentialRampToValueAtTime(.0001,now+.13);o.connect(g);g.connect(ac.destination);o.start(now);o.stop(now+.14);
    var o2=ac.createOscillator(),g2=ac.createGain();o2.type='triangle';o2.frequency.setValueAtTime(640+chain*35,now);
    o2.frequency.exponentialRampToValueAtTime(180,now+.08);g2.gain.setValueAtTime(.025*effectsVolume,now);g2.gain.exponentialRampToValueAtTime(.0001,now+.09);
    o2.connect(g2);g2.connect(ac.destination);o2.start(now);o2.stop(now+.10);

}
function birdPalette(kind){
  if(kind==='crow')return['#11151a','#2e3740','#8c98a1','#d8d9cd'];
  if(kind==='tit')return['#d6c64e','#2a3642','#d9e1df','#758866'];
  if(kind==='black')return['#15191d','#303942','#a84d39','#d9d6ca'];
  if(kind==='cyg')return['#8b8f91','#c2c6c4','#ddd9ce','#6c7378'];

}

  var pal=birdPalette(kind),n=16+Math.min(18,chain*3);

  for(var i=0;i<n;i++){
    var a=(i/n)*Math.PI*2+(Math.random()-.5)*.35,sp=18+Math.random()*44+chain*2;
    birdFeathers.push({
      x:x,y:y-5,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-13-Math.random()*11,
      g:58+Math.random()*35,l:.55+Math.random()*.55,c:pal[i%pal.length],s:Math.random()<.74?1:2
    });
  }
  if(birdFeathers.length>180)birdFeathers.splice(0,birdFeathers.length-180);

}

  blastCombo=blastComboT>0?blastCombo+1:1;blastComboT=2.2;
  blastScore+=base*blastCombo;
  if(Math.random()<.22+Math.min(.18,chain*.035))spawnLooseSeeds(P.x+P.face*8,P.y-8,1);

  setBlastHud();
}
function removeBirdObject(kind,obj){

  else if(kind==='tit'){i=smallFauna.indexOf(obj);if(i>=0)smallFauna.splice(i,1);}
  else {
    i=swans.indexOf(obj);
    if(i>=0){

    }

}
var swanHarm={w:0,n:0};
function swanThanks(w){

  swans.slice(0,3).forEach(function(sw){spawnLooseSeeds(sw.x,sw.y-10,2,true);});
  socialTone('gift');gardenAction(200,10,'SWAN GIFT');return true;
}
function blastBird(kind,obj,chain){
  var x=obj.x,y=obj.y-(kind==='crow'?5:(kind==='tit'?7:8));
  if(kind==='swan'||kind==='cyg'||kind==='black'){if(swanHarm.w!==worldLevel())swanHarm={w:worldLevel(),n:0};swanHarm.n++;}
  spawnBirdBlast(kind,x,y,chain);scoreBird(kind,chain);removeBirdObject(kind,obj);
  chainBirds(x,y,chain+1);
}
function chainBirds(x,y,chain){
  if(chain>5)return;
  var radius=18+chain*5,i,c,a,sw;
  for(i=crows.length-1;i>=0;i--){c=crows[i];if(Math.hypot(c.x-x,c.y-y)<radius){blastBird('crow',c,chain);return;}}
  for(i=smallFauna.length-1;i>=0;i--){a=smallFauna[i];if(a.kind==='tit'&&Math.hypot(a.x-x,a.y-y)<radius){blastBird('tit',a,chain);return;}}
  for(i=swans.length-1;i>=0;i--){sw=swans[i];if(Math.hypot(sw.x-x,sw.y-y)<radius){blastBird(sw.kind==='cyg'?'cyg':(sw.kind==='black'?'black':'swan'),sw,chain);return;}}
}
function blastBirdAt(wx,wy){
  var best=null,kind='',bd=23,i,d;
  for(i=0;i<crows.length;i++){d=Math.hypot(crows[i].x-wx,(crows[i].y-5)-wy);if(d<bd){bd=d;best=crows[i];kind='crow';}}
  for(i=0;i<smallFauna.length;i++){var a=smallFauna[i];if(a.kind!=='tit')continue;d=Math.hypot(a.x-wx,(a.y-7)-wy);if(d<bd){bd=d;best=a;kind='tit';}}
  for(i=0;i<swans.length;i++){var sw=swans[i];d=Math.hypot(sw.x-wx,(sw.y-8)-wy);if(d<bd+5){bd=d;best=sw;kind=sw.kind==='cyg'?'cyg':(sw.kind==='black'?'black':'swan');}}
  if(!best)return false;
  blastBird(kind,best,1);return true;
}
function updateBirdBlasts(dt){

  for(var i=birdBlasts.length-1;i>=0;i--){var b=birdBlasts[i];b.t+=dt;if(b.t>=b.life)birdBlasts.splice(i,1);}
  for(i=birdFeathers.length-1;i>=0;i--){
    var f=birdFeathers[i];f.l-=dt;f.vy+=f.g*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=Math.pow(.96,dt*60);

function drawBirdBlasts(){
  var i,b,f,sx,sy,p,k,ang,rr,px,py;
  for(i=0;i<birdBlasts.length;i++){
    b=birdBlasts[i];p=b.t/b.life;sx=Math.round(b.x-camX);sy=Math.round(b.y-camY);
    var r=2+p*17,a=(1-p)*.62;
    ctx.globalCompositeOperation='lighter';

    // Irregular circular shock ring made from pixels, never a rectangle.
    ctx.fillStyle='rgba(255,224,150,'+a.toFixed(3)+')';
    for(k=0;k<18;k++){
      ang=k*Math.PI*2/18+b.chain*.31;
      rr=r*(.82+.16*Math.sin(k*2.7+b.chain));
      px=Math.round(sx+Math.cos(ang)*rr);
      py=Math.round(sy+Math.sin(ang)*rr*.72);
      ctx.fillRect(px,py,(k%5===0&&p<.55)?2:1,1);
    }

    // Short radial streaks make the blast feel organic and explosive.
    ctx.fillStyle='rgba(255,241,198,'+Math.min(.7,a*1.25).toFixed(3)+')';
    for(k=0;k<8;k++){
      ang=k*Math.PI/4+b.chain*.19;
      rr=3+p*(7+(k%3)*2);

      py=Math.round(sy+Math.sin(ang)*rr*.78);
      ctx.fillRect(px,py,1+(k%3===0?1:0),1);
    }

    disc(sx,sy,Math.max(1,Math.round((1-p)*4)),'rgba(255,247,210,'+(.16*(1-p)).toFixed(3)+')');
    ctx.globalCompositeOperation='source-over';
  }
  for(i=0;i<birdFeathers.length;i++){
    f=birdFeathers[i];sx=Math.round(f.x-camX);sy=Math.round(f.y-camY);
    if(sx<-4||sx>IW+4||sy<-4||sy>IH+4)continue;

  }
  ctx.globalAlpha=1;
}

/* ---------------------------------------------------------------- living biomes + social AI
   The world is divided into long deterministic biomes. Wildlife carries
   memory of how Max behaves: sprinting at birds raises fear, quiet nearby
   time raises trust, and trusted animals approach/follow rather than merely
   choosing random actions. Taps are contextual; a long press nurtures a
   patch of ground. Everything remains deterministic/pixel-native to the
   existing garden except short-lived social memories. */
var BIOME_W = 640;
var BIOMES = [
  { id:'meadow', sky:'#0d0909', mtn:'#302d4a', forest:'#424b2c', g:'#1d2124', top:'#2d3338', stem:'#44533a', stemLit:'#62744e', mood:'open' },
  { id:'wetland',sky:'#061016', mtn:'#213640', forest:'#294238', g:'#142226', top:'#263b41', stem:'#355b4c', stemLit:'#6b8a72', mood:'water' },
  { id:'grove',  sky:'#060b09', mtn:'#22312b', forest:'#203526', g:'#131d17', top:'#263429', stem:'#38543b', stemLit:'#647b5d', mood:'shelter' },
  { id:'heath',  sky:'#120912', mtn:'#48344a', forest:'#433a34', g:'#29242b', top:'#403541', stem:'#615143', stemLit:'#806d55', mood:'wind' },
  { id:'moon',   sky:'#070a1b', mtn:'#303b61', forest:'#2b4058', g:'#192033', top:'#2d3b58', stem:'#455d7a', stemLit:'#7890ab', mood:'glow' },
  { id:'fungal', sky:'#100814', mtn:'#3b2c49', forest:'#35283d', g:'#211724', top:'#3a2b40', stem:'#4f4055', stemLit:'#806c88', mood:'spore' },
  { id:'frost',  sky:'#071016', mtn:'#445766', forest:'#394c52', g:'#1a2429', top:'#3b4a50', stem:'#516168', stemLit:'#87979d', mood:'cold' },
  { id:'ember',  sky:'#150907', mtn:'#4b2d26', forest:'#3f3028', g:'#241a17', top:'#493029', stem:'#5b4938', stemLit:'#8a7051', mood:'warm' }
];
function imod(n,m){ return ((n%m)+m)%m; }
function clamp01(v){ return v<0?0:(v>1?1:v); }
function biomeAt(x){
  var seg=Math.floor(x/BIOME_W), u=(x-seg*BIOME_W)/BIOME_W;
  var def=BIOMES[imod(seg,BIOMES.length)];
  return { id:def.id, def:def, seg:seg, u:u };
}
function mixHex(a,b,t){
  function p(q,i){return parseInt(q.slice(i,i+2),16);}
  function h(v){v=Math.max(0,Math.min(255,Math.round(v)));return (v<16?'0':'')+v.toString(16);}
  return '#'+h(p(a,1)+(p(b,1)-p(a,1))*t)+h(p(a,3)+(p(b,3)-p(a,3))*t)+h(p(a,5)+(p(b,5)-p(a,5))*t);
}
function biomeVisual(x){
  var q=biomeAt(x), a=q.def, b=BIOMES[imod(q.seg+1,BIOMES.length)], t=0;

}

  C.gBase=mixHex(a.g,b.g,t); C.gMid=C.gBase; C.gDeep=C.gBase;
  C.gLit=mixHex(a.top,b.top,t); C.gTop=mixHex(a.g,b.g,.34+t*.22);
  C.stem=mixHex(a.stem,b.stem,t); C.stemLit=mixHex(a.stemLit,b.stemLit,t);
}

/* ---------------------------------------------------------------- authored level composition
   Each biome gets a deterministic "room": approach, clearing, landmark and exit.
   The landmark uses the same native sprite language as the supplied atlas; no
   foreign art style is introduced. Larger foreground stamps are integer-scaled
   so the pixel grid remains crisp. */
var landmarkStates={};
function landmarkForSeg(seg){
  var def=BIOMES[imod(seg,BIOMES.length)],j=h1(seg*17.17+4.3);
  var x=seg*BIOME_W+BIOME_W*(.48+(j-.5)*.12);
  if(typeof waterAt==='function'&&waterAt(x))x=dryX(x);
  return {seg:seg,id:def.id,x:x,seed:h1(seg*9.91+2.2)*999};
}
function landmarkAt(x){return landmarkForSeg(Math.floor(x/BIOME_W));}
function landmarkDist(x){
  var q=biomeAt(x),a=landmarkForSeg(q.seg),b=landmarkForSeg(q.seg+(q.u>.5?1:-1));
  return Math.min(Math.abs(x-a.x),Math.abs(x-b.x));
}
function landmarkState(l){
  var k=l.seg+':'+l.id,q=landmarkStates[k];
  if(!q)q=landmarkStates[k]={awake:0,touched:0};
  return q;
}
function interactLandmarkAt(wx,wy,strong){
  var q=biomeAt(wx),cand=[landmarkForSeg(q.seg-1),landmarkForSeg(q.seg),landmarkForSeg(q.seg+1)];
  for(var i=0;i<cand.length;i++){
    var l=cand[i],gy=surfaceY(l.x);
    if(Math.abs(l.x-wx)<30&&Math.abs((gy-10)-wy)<42){
      var st=landmarkState(l);st.awake=Math.max(st.awake,strong?32:15);st.touched++;
      if(strong){
        var lk='l'+l.seg;
        if(!seedCollected[lk]){
          seedCollected[lk]=1;spawnLooseSeeds(l.x,gy-3,1+(Math.abs(l.seg)%5===0?1:0));
          nudgeGardenHint('LANDMARK FOUND · SEEDS DROPPED');saveGarden();
        }
        worldMind.trust=clamp01(worldMind.trust+.012);
      }
      socialTone(strong?'gift':'call');
      return true;
    }
  }
  return false;
}
function updateLandmarks(dt){
  for(var k in landmarkStates)landmarkStates[k].awake=Math.max(0,landmarkStates[k].awake-dt);
}
function drawBiomeSkyBands(hy){
  var q=biomeVisual(P.x),top=mixHex(q.a.sky,'#000000',.20),hor=mixHex(q.a.sky,q.a.mtn,.23);
  ctx.globalAlpha=.22;ctx.fillStyle=top;ctx.fillRect(0,0,IW,Math.max(1,(hy*.30)|0));

function gScaled(r,cx,gy,scale,flip,alpha){

var worldWeather={type:'clear',target:'clear',intensity:0,targetI:0,timer:8,seed:17,wind:0};
function chooseWeather(){
  var id=biomeAt(P.x).id,r=Math.random(),w='clear',i=.25+.55*Math.random();
  if(id==='wetland')w=r<.48?'rain':(r<.76?'mist':'clear');

  else if(id==='heath')w=r<.55?'wind':(r<.72?'mist':'clear');
  else if(id==='moon')w=r<.38?'mist':(r<.55?'wind':'clear');
  else if(id==='fungal')w=r<.52?'spore':(r<.70?'mist':'clear');
  else if(id==='frost')w=r<.62?'frost':(r<.78?'wind':'clear');
  else if(id==='ember')w=r<.52?'ember':(r<.72?'wind':'clear');

function weatherWind(){

function updateWeather(dt){

function gardenBirdGuards(dt){

      var len = (ac.sampleRate * 1.2) | 0, buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      sfx.buf = buf;
    }
    var now = ac.currentTime, src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = sfx.buf; src.connect(f); f.connect(g); g.connect(ac.destination);

      g.gain.setValueAtTime(0.0001, now); g.gain.exponentialRampToValueAtTime(vol, now + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, now + 1.05);
      src.start(now); src.stop(now + 1.1);

      g.gain.setValueAtTime(0.05*effectsVolume, now); g.gain.exponentialRampToValueAtTime(0.0001, now + 0.17);
      src.start(now, 0.3); src.stop(now + 0.18);
    } else if (kind === 'thud') {

      f.type='lowpass';f.frequency.setValueAtTime(1400,now);f.frequency.exponentialRampToValueAtTime(260,now+0.14);
      g.gain.setValueAtTime(0.0001,now);g.gain.exponentialRampToValueAtTime(tv,now+0.005);g.gain.exponentialRampToValueAtTime(0.0001,now+0.18);
      src.start(now,0.1);src.stop(now+0.2);
      var o2=ac.createOscillator(),og2=ac.createGain();o2.type='triangle';o2.frequency.setValueAtTime(240,now);o2.frequency.exponentialRampToValueAtTime(110,now+0.12);
      og2.gain.setValueAtTime(tv*.8,now);og2.gain.exponentialRampToValueAtTime(0.0001,now+0.14);o2.connect(og2);og2.connect(ac.destination);o2.start(now);o2.stop(now+0.15);
    } else if (kind === 'crunch') {
      var bv=0.07*effectsVolume*Math.max(0.2,1-(dist||0)/400);
      f.type='bandpass';f.Q.value=1.8;f.frequency.setValueAtTime(1300,now);f.frequency.exponentialRampToValueAtTime(380,now+0.07);
      g.gain.setValueAtTime(0.0001,now);g.gain.exponentialRampToValueAtTime(bv,now+0.004);g.gain.exponentialRampToValueAtTime(0.0001,now+0.09);
      src.start(now,0.45);src.stop(now+0.1);
      var o3=ac.createOscillator(),og3=ac.createGain();o3.type='square';o3.frequency.setValueAtTime(260,now);o3.frequency.exponentialRampToValueAtTime(130,now+0.08);
      og3.gain.setValueAtTime(bv*.25,now);og3.gain.exponentialRampToValueAtTime(0.0001,now+0.09);o3.connect(og3);og3.connect(ac.destination);o3.start(now);o3.stop(now+0.1);
    } else {
      f.type = 'highpass'; f.frequency.value = 1500;
      g.gain.setValueAtTime(0.0001, now + 0.03); g.gain.exponentialRampToValueAtTime(0.07*effectsVolume, now + 0.04); g.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);

function updateRat(k,dt){
  if(coopGuest()||runIsPaused()||!isRat(k)||k.hp<=0)return;
  dt=Math.max(0,Math.min(.1,dt));k.ratStateT=(k.ratStateT||0)+dt;k.ratJumpCool=Math.max(0,(k.ratJumpCool||0)-dt);

    ratMove(k,away*35,dt);k.bite=Math.max(k.bite,.45);return;
  }
  if(k.ratState==='hurt'){ratState(k,'recover');k.bite=Math.max(k.bite,.3);}
  if(k.ratState==='windup'){
    k.windup=Math.max(0,k.windup-dt);ratMove(k,0,dt);
    if(!k.ratGrounded){cancelRatAttack(k);ratState(k,'recover');k.bite=.5;return;}
    if(k.windup===0){ratState(k,'attack');k.attackT=k.attackDuration=.22;k.vx=k.face*104;}

  }

    k.face=dx<0?-1:1;k.ratAimX=target.x;k.ratAimY=target.y;k.ratTargetId=target.plant?target.plant.id:0;
    k.tell=k.windup=.6;ratState(k,'windup');k.vx=k.vy=0;

    if(e==='flock'&&wonders.t-wonders.ena<4)for(var b=0;b<7;b++){var bx=P.x-120+b*14+(wonders.t-wonders.ena)*70,by=surfaceY(P.x)-90-(b%3)*6;ctx.fillStyle='#1c1a22';ctx.fillRect(Math.round(bx-camX),Math.round(by-camY),1,1);ctx.fillRect(Math.round(bx-camX)-1,Math.round(by-camY)-1,1,1);ctx.fillRect(Math.round(bx-camX)+1,Math.round(by-camY)-1,1,1);}
  }
  if(wonders.gate&&!wonders.next){var near=Math.abs(P.x-wonders.gx)<60;if(near||blink)wonderDraw('gate',wonders.gx,wonders.gy);}
}
var tunnels={w:0,s:[]};
function canBurrow(){return !!(rogueRun.shovel&&!coop&&P.st==='free'&&P.grounded&&!P.wet&&!P.platform&&!climb&&!warp&&Math.abs(P.y-surfaceY(P.x))<=4&&!waterAt(P.x)&&!parryable(P.x,P.y)&&!floatKrek.some(function(k){return k.hp>0&&Math.abs(k.x-P.x)<40&&Math.abs(k.y-P.y)<40;}));}
function startBurrow(){
  P.st='burrow';P.vx=P.vy=0;P.y=surfaceY(P.x)+12;P.brace=0;burrowCarve();setAnim('idle');chime([131,98],.08,.05);
  for(var i=0;i<14;i++)parts.push({x:P.x+(Math.random()-.5)*10,y:surfaceY(P.x)-1,vx:(Math.random()-.5)*50,vy:-20-Math.random()*40,l:.6,m:.6,c:'90,70,50'});
  return true;
}
function burrowCarve(){
  if(tunnels.w!==worldLevel())tunnels={w:worldLevel(),s:[]};
  var x=Math.round(P.x),last=tunnels.s[tunnels.s.length-1];
  if(last&&x>=last[0]-3&&x<=last[1]+3){last[0]=Math.min(last[0],x-5);last[1]=Math.max(last[1],x+5);}else if(tunnels.s.length<40)tunnels.s.push([x-5,x+5]);
}
function updateBurrow(dt,inp){
  P.vx=(inp.axis||0)*WALK_V*.8;var nx=P.x+P.vx*dt;if(!waterAt(nx))P.x=nx;else P.vx=0;
  if(P.vx)P.face=P.vx>0?1:-1;P.y=surfaceY(P.x)+12;P.vy=0;P.grounded=true;P.platform=null;burrowCarve();
  var a=P.vx?'run':'idle';if(P.anim!==a)setAnim(a);
  [wonders.b1,wonders.b2].forEach(function(bx,i){if(bx&&!(wonders.bc&1<<i)&&Math.abs(P.x-bx)<5){wonders.bc|=1<<i;spawnLooseSeeds(bx,surfaceY(bx)-8,3,true);chime([659,784,988],.06,.035);}});
  if(jumpBuf>0){jumpBuf=0;burrowErupt();}
}
function burrowErupt(){
  P.st='free';P.y=surfaceY(P.x);P.vy=JUMP_V*1.15;P.grounded=false;setAnim('rise');
  floatKrek.forEach(function(k){if(k.hp>0&&Math.abs(k.x-P.x)<28&&k.y>P.y-60)damagePest(k,2,P.x);});
  for(var i=0;i<20;i++)parts.push({x:P.x+(Math.random()-.5)*12,y:P.y-2,vx:(Math.random()-.5)*60,vy:-30-Math.random()*50,l:.7,m:.7,c:'90,70,50'});
  shake=Math.min(3,shake+1.5);chime([196,262],.05,.06);
}
function drawTunnels(){
  if(tunnels.w===worldLevel())tunnels.s.forEach(function(s){for(var x=s[0];x<=s[1];x++){var sx=Math.round(x-camX);if(sx<-1||sx>IW)continue;ctx.fillStyle='#16110d';ctx.fillRect(sx,Math.round(surfaceY(x)+3-camY),1,11);}});
  if(wonders.world!==worldLevel())return;
  if(P.st==='burrow'||tunnels.w===worldLevel())[wonders.b1,wonders.b2].forEach(function(bx,i){if(bx&&!(wonders.bc&1<<i)&&(P.st==='burrow'&&Math.abs(P.x-bx)<50))wonderDraw('cache',bx,surfaceY(bx)+12);});
  if(wonders.sh&&!rogueRun.shovel)wonderDraw('shovel',wonders.sh,surfaceY(wonders.sh)+1);
}
function drawWonderAir(){
  if(wonders.world!==worldLevel()||wonders.special!=='cavern')return;
  var cx=Math.round(P.x-camX),cy=Math.round(P.y-12-camY),R=48;ctx.fillStyle='rgba(8,8,14,0.62)';
  for(var y=0;y<IH;y+=2){var d=Math.abs(y-cy),hw=d<R?Math.round(Math.sqrt(R*R-d*d)):0;if(!hw){ctx.fillRect(0,y,IW,2);continue;}ctx.fillRect(0,y,Math.max(0,cx-hw),2);ctx.fillRect(cx+hw,y,IW,2);}
}


/* ---------------------------------------------------------------- loop */
var last = 0, tSec = 0, stepAcc = 0;

function frame(now) {
  var dt = (now - last) / 1000;
  var clockDt=Math.max(0,dt);
  last = now;
  if (dt > 0.05) dt = 0.05;
  pollPads();
  if (window.innerWidth !== lastVW || window.innerHeight !== lastVH) resize();
  if ((window.scrollY || window.scrollX) && window.scrollTo) window.scrollTo(0, 0);
  if (dt < 0) dt = 0;
  coopFrame();
  if(worldCovered){requestAnimationFrame(frame);return;}
  var paused=runIsPaused();
  if(!paused){
  tSec += dt;

  var inp = readInput();
  if(!runIsPaused())updateCharge(dt);
  if(!runIsPaused())updatePlayer(dt, inp);
  if(!runIsPaused())updateWarp(dt);
  if(!runIsPaused())updateParts(dt);
  if(!coopGuest()){
  var ownBuild=rogueRun.perks;if(coop)rogueRun.perks=coopTeamPerks();
  if(!runIsPaused())updateCrows(dt);
  if(!runIsPaused())updateSmallFauna(dt);
  if(!runIsPaused())updateFlock(dt);
  if(!runIsPaused())updateSwans(dt);
  if(!runIsPaused())updateSwanSky(dt);
  if(!runIsPaused())updateFlyers(dt, tSec);
  if(!runIsPaused())updateWeather(dt);
  if(!runIsPaused())updateLightStates(dt);
  if(!runIsPaused())updateLandmarks(dt);
  if(!runIsPaused())updateBirdBlasts(dt);
  if(!runIsPaused())updateAnts(dt);
  if(!runIsPaused())updateSeedPickups(dt);
  if(!runIsPaused())updateCompanion(dt);
  if(!runIsPaused())updateGarden(dt);
  if(!runIsPaused())updateGardenFun(dt);
  if(!runIsPaused())updateRunCompetition(clockDt);
  if(!runIsPaused())updateRunDirector(dt);
  if(!runIsPaused())updateKrek(dt);
  if(!runIsPaused())gardenBirdGuards(dt);
  if(!runIsPaused())updateSmartWorld(dt);
  if(!runIsPaused())rebalanceEcology(dt);
  if(!runIsPaused())ecosystemLinks(dt);
  if(!runIsPaused())updateBombs(dt);
  if(!runIsPaused())updateFeathers(dt);
  if(!runIsPaused())refillBirds(dt);
  if(coop)rogueRun.perks=coop.members[coop.me].perks;
  }else{
    bombCool=Math.max(0,bombCool-dt);
    updateSeedPickups(dt);updateRunLoot();
    bombs.forEach(function(b){if(b.st==='fly'){b.x+=b.vx*dt;b.y+=b.vy*dt;b.vy+=BOMB_G*dt;}});
    floatKrek.forEach(function(k){if(isRat(k)){predictRat(k,dt);return;}k.x+=(k.vx||0)*dt;k.y+=(k.vy||0)*dt;});
    updateFeathers(dt);
  }
  if(!runIsPaused())updateHazardContact();
  if(!runIsPaused())listenRun();
  if(!runIsPaused())updateSecrets(dt);
  if(!runIsPaused())updateWonders(dt);
  }
  if((rogueRun.ended||(window.MaxRunResults&&window.MaxRunResults.isOpen()))&&!resultAtlasReady&&resultAssetsReady()){resultAtlasReady=true;if(window.MaxRunResults)window.MaxRunResults.redraw();}

  if (!paused && P.grounded && Math.abs(P.vx) > (P.wet ? 5 : 20)) {
    stepAcc += Math.abs(P.vx) * dt;
    if (stepAcc > 10.2) { stepAcc = 0; if (P.wet) ripple(P.x, waterAt(P.x).level, 'ring'); else if (Math.random() < 0.7) stepDust(); }
  } else stepAcc = 0;

  var look = Math.max(-26,Math.min(26,P.vx*.30));
  var tx = P.x - IW * 0.5 + look, ty = P.y - climbAnchor();
  if (!started) { camX = tx; camY = ty; started = true; }
  camX += (tx - camX) * (1 - Math.pow(0.0026, dt));
  camY += (ty - camY) * (1 - Math.pow(0.012, dt));

  var fx = camX, fy = camY;
  if (shake > 0) { camX += (Math.random() * 2 - 1) * shake; camY += (Math.random() * 2 - 1) * shake * 0.6; }
  camX = Math.round(camX); camY = Math.round(camY);
  buildSurfCache();

  var hy = HY = ANCHOR + 6;
  hy += backdropLift();
  /* on a short screen the far layers sink behind the ground, so a strip of
     night sky with the moon stays open; on a tall screen this is zero */
  var mh = ready(IMG.mtn) ? IMG.mtn.naturalHeight : 159;
  var bdrop = Math.max(0, Math.round(Math.min(60, IH * 0.15)) - (hy - mh));
  applyBiomePalette(P.x);
  drawSky(tSec, hy);
  drawBiomeSkyBands(hy);
  drawMoon(hy);
  drawSecretSky(tSec, hy);
  var backdrop = gardenBackdrop(), far = backdrop && ready(backdrop.far) ? backdrop.far : IMG.mtn, mid = backdrop && ready(backdrop.mid) ? backdrop.mid : IMG.forest;
  drawTiled(far, 0.10, hy + bdrop, true, MTN_BASE);
  drawFlock();
  drawSwanSky();
  drawTiled(mid, 0.35, hy + Math.round(bdrop * 0.55), mid !== IMG.forest, FOREST_BASE);
  drawClouds(hy + Math.round(bdrop * 0.6), tSec);
  drawBiomeBackdrop(tSec, hy);
  drawBiomeTint();
  drawFarFlora(tSec);
  drawLandmarkBack(tSec);
  drawGround();
  drawTrailAccents();
  drawSoil();
  drawBiomeSoil(tSec);
  drawSurfaceTrim(tSec);
  drawRocks();
  drawGrass(tSec);
  drawScorches();
  drawTallFlora(tSec);
  drawFigmaPlants(tSec);
  drawBiomeFlora(tSec);
  drawLandmarks(tSec);
  drawBiomeTransitionMarkers();
  drawPlatforms();
  drawSmartWorld(tSec);
  drawSeedPickups(tSec);
  drawRunExploration(tSec);
  drawGardenPlots(tSec);
  drawSecretGround(tSec);
  drawWonders(tSec);
  drawClassAuras();
  drawAnts();
  drawLowFlora(tSec, false);
  drawLights(tSec);
  drawWater(tSec);
  drawPondDeco(false);
  drawPondExtras();
  drawParts();
  drawCrows();
  drawSmallFauna();
  drawSwans();
  drawKrek(tSec);
  drawRunHazards(tSec);
  drawSecretAir(tSec);
  drawWonderAir();
  drawBirdBlasts();
  drawCompanion();
  drawPlayer();drawCharge();drawSkillPip();drawExitCue(tSec);drawCoopPlayers(dt);drawTeamArrows();drawMouseReticle();
  drawPickupNotice(dt);
  drawClimbSky(tSec);
  drawBombs(tSec);
  drawFeathers();
  drawPondDeco(true);
  drawLowFlora(tSec, true);
  drawGlows(tSec);
  drawMaxLight(tSec);
  drawFlyers(tSec);
  drawFlies(tSec);
  drawForegroundFrame(tSec);
  drawWeather(tSec);
  drawBiomeGrade();
  drawBooms();
  drawVignette();
  drawWarp(tSec);
  drawWorldBanner(tSec);drawBossBar(dt);
  drawRunHud();

  camX = fx; camY = fy;
  requestAnimationFrame(frame);
}

function attachGameMenu(){
  if(!window.MaxGameMenu)return;
  window.MaxGameMenu.attach({
    pause:setMenuPaused,
    setCovered:function(v){worldCovered=!!v;},
    effectsVolume:function(){return effectsVolume;},
    musicVolume:function(){return musicVolume;},
    setEffectsVolume:setEffectsVolume,
    setMusicVolume:setMusicVolume,
    summary:function(){return{started:runElapsed>0||gardenSeeds>0||rogueRun.garden.length>0,ended:!!rogueRun.ended};},
    canOpenMenu:function(){return !runActive||rogueRun.ended;},
    records:function(){return{runs:rogueMeta.runs|0,world:rogueMeta.bestWorld|0,plants:rogueMeta.bestPlants|0};},
    plantCollection:plantCollection,wonderLog:wonderLog,drawPlant:drawResultPlant,drawGardenScene:drawGardenScene,gallerySpacing:GALLERY_SP,
    openGardenRecords:openGardenRecords,
    beginRun:function(selection){coop=null;resetRogueRun('NEW RUN',selection);},
    clearInput:clearRunInput,exitRun:function(){if(runActive&&!rogueRun.ended)finalizeRogueRun(false);stopCoop();if(window.MaxRunResults)window.MaxRunResults.hide();},
    beginCoop:beginCoop,stopCoop:stopCoop,coopRoster:coopRoster,coopState:coopState,coopInput:coopInput,coopDepart:coopDepart,coopJoin:coopJoin
  });
}
window.addEventListener('max-menu-ready',attachGameMenu);
function start() {
  P.x=0;
  P.y = surfaceY(P.x);
  ensureCompanion();
  if(window.fetch&&window.MaxCompanion)window.MaxCompanion.loadArt().then(function(){if(window.MaxRunResults)window.MaxRunResults.redraw();});
  resize();
  gardenPlots.forEach(recordGardenPlant);
  updateGardenHud();
  attachGameMenu();
  last = performance.now();
  requestAnimationFrame(frame);
}

start();
})();
