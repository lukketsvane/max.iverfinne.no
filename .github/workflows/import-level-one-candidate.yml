name: Import isolated Level 1 candidate
on:
  push:
    branches: [codex/level-one-figma-identity]
    paths: [.github/workflows/import-level-one-candidate.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/level-one-figma-identity
          fetch-depth: 2
      - name: Import the pinned isolated tree without touching main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 37d21a9ab8a645081d2c77a9b6a6cfae390665f9
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 37d21a9ab8a645081d2c77a9b6a6cfae390665f9
          curl --fail --silent --show-error --location --max-time 60 https://sb-nx2o45ka3do9.vercel.run/level-one.patch -o /tmp/level-one.patch
          echo '67032e1c8f73bad2d0f4c2f3af7092f77a7644e0e4bbae3cc9c82fe1cc6a84f8  /tmp/level-one.patch' | sha256sum --check
          git rm .github/workflows/import-level-one-candidate.yml
          git apply --index /tmp/level-one.patch
          test "$(git write-tree)" = 8710d1a023a789f85e8ea3863c2f80faf77cc3bd
          git diff --cached --check
          git config user.name Codex
          git config user.email codex@users.noreply.github.com
          git commit -m 'Bind candidate Level 1 to current Hollow Tree Figma source'
          git push origin HEAD:refs/heads/codex/level-one-figma-identity
          printf 'Candidate tree published for review; full tests and Figma source validation are not certified.\n'
