name: Rat integration verification
on:
  push:
    branches: [gameplay/rat-enemies]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Export tracked source for integration inspection
        if: always()
        run: git archive --format=tar.gz HEAD -o game-source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rat-integration-source
          path: game-source.tar.gz
          retention-days: 2
