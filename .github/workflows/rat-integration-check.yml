name: Rat browser acceptance
on:
  push:
    branches: [gameplay/rat-enemies]
    paths:
      - scripts/check-rat-browser.mjs
      - .github/workflows/rat-integration-check.yml
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-rat-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rat-browser-evidence
          path: rat-browser-evidence
          retention-days: 7
