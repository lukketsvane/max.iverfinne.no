name: Integrate High Tide
on:
  push:
    branches: [high-tide]
    paths: ['.github/workflows/high-tide-integrate.yml', 'scripts/apply-high-tide.cjs', 'high-tide.inc.js', 'tests/high-tide*.test.cjs']
permissions:
  contents: write
concurrency:
  group: high-tide-integration
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: high-tide
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Apply checked source edits
        run: |
          node scripts/apply-high-tide.cjs
          node <<'JS'
          const fs=require('node:fs'),f='tests/relics.test.cjs';
          let s=fs.readFileSync(f,'utf8');
          s=s.replaceAll("['last-seed']","['high-tide','last-seed']");
          const before='assert.deepEqual(relicCollection(user),[]);';
          if(!s.includes(before))throw new Error('Relic guest test changed; review expected public access.');
          s=s.replace(before,"assert.deepEqual(relicCollection(user).map(r=>r.id),['high-tide']);");
          fs.writeFileSync(f,s);
          JS
      - name: Test every game regression
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/high-tide-tests.log
      - name: Build production bundle
        run: npm run build
      - name: Publish verified source edits on feature branch
        run: |
          git rm scripts/apply-high-tide.cjs .github/workflows/high-tide-integrate.yml
          git add index.html last-seed.inc.js coop-game.inc.js run-director.inc.js game-menu.mjs coop-session.mjs run-results.js scripts/build-static.cjs tests/game-harness.cjs tests/relics.test.cjs review.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrate tested High Tide mode into shared game engine'
          git push origin HEAD:high-tide
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: high-tide-test-log
          path: /tmp/high-tide-tests.log
          retention-days: 3
