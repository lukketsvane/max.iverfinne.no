name: Deploy MAX FUGLESPRENGER
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global vercel@latest
      - name: Deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          URL="$(vercel deploy --prod --yes --token="$VERCEL_TOKEN" --scope=iverfinnes-projects)"
          echo "DEPLOYMENT_URL=$URL" >> "$GITHUB_ENV"
          echo "$URL"
      - name: Point max.iverfinne.no at this deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          vercel alias set "$DEPLOYMENT_URL" max.iverfinne.no --token="$VERCEL_TOKEN" --scope=iverfinnes-projects
