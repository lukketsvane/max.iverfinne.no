name: Complete approved wide level import
on:
  push:
    branches: [codex/complete-wide-levels-01-02-04-06-20261017]
permissions:
  contents: read
concurrency:
  group: complete-approved-wide-import
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve current main and recover source bytes
        env:
          SOURCE_A: https://www.figma.com/api/mcp/asset/8e798f14-2c3d-4111-9c5a-703bb6b902a7.png
          SOURCE_B: https://www.figma.com/api/mcp/asset/358aada7-bb64-4ed2-828f-1d6262f7de8a.png
          SOURCE_C: https://www.figma.com/api/mcp/asset/5937d0ac-65ca-41c2-b1ec-900b0fbddd92.png
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-edit origin/main
          python3 - <<'PY'
          import hashlib, os, urllib.request
          from pathlib import Path
          expected = {'8f9b79d7b224227b8f7a29c4352624a642160bdb':'railway-ruins-current', 'bc56aac8c6292a9cbd941cd2aad48830296179d1':'mossback-sanctuary-current', '4fcca6a3e9c5ace87a8bb7353280f021b1b734e0':'cairn-terraces-current'}
          found = set()
          for key in ['SOURCE_A', 'SOURCE_B', 'SOURCE_C']:
              print('::add-mask::' + os.environ[key])
              response = urllib.request.urlopen(os.environ[key], timeout=60)
              data = response.read()
              digest = hashlib.sha1(data).hexdigest()
              print(key, response.headers.get('Content-Type'), len(data), digest, data[:8].hex())
              assert data[:8] == b'\x89PNG\r\n\x1a\n', 'Source response is not PNG'
              assert digest in expected and digest not in found, 'Unexpected source bytes'
              found.add(digest)
              Path('assets/levels-v2/' + expected[digest] + '.png').write_bytes(data)
          assert found == set(expected)
          print('Three actual Figma PNG exports recovered; exact SHA-1 matches.')
          PY
      - run: npm ci
      - name: Compile and verify exact imported source bindings
        run: |
          set -euo pipefail
          python3 docs/design/figma-import-01-09/prepare-wide-import.py
          node --test tests/current-wide-levels.test.cjs
          npm run build
      - name: Save only the recovered candidate
        id: commit
        run: |
          set -euo pipefail
          git rm .github/workflows/complete-approved-wide-import.yml
          git add assets/figma-manifest.json assets/levels-v2/hollow-tree-current.png assets/levels-v2/railway-ruins-current.png assets/levels-v2/mossback-sanctuary-current.png assets/levels-v2/cairn-terraces-current.png index.html levels.js levels-data.js level-scenes-data.js scripts/current-wide-levels.mjs scripts/figma-level-drafts.mjs tests docs/design/level-one-current docs/design/figma-import-01-09 docs/design/finished-game-progress.json
          git commit -m "Import the four approved wide Figma levels with exact native source bindings"
          git push origin HEAD:codex/complete-wide-levels-01-02-04-06-20261017
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  regression:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - if: always()
        run: npm run build
  traversal:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        stage: [1, 2, 4, 6]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node scripts/wide-level-sweep.mjs ${{ matrix.stage }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wide-level-${{ matrix.stage }}-traversal
          path: docs/design/figma-import-01-09/evidence/sweep-*.json
  result:
    if: always() && needs.prepare.result == 'success'
    needs: [prepare, regression, traversal]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Record the exact candidate's tests and traversal result
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.prepare.outputs.sha }}
          STATE: ${{ needs.regression.result == 'success' && needs.traversal.result == 'success' && 'success' || 'failure' }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" -f state="$STATE" -f context='Wide import / full tests build and traversal' -f description='Checks cover the exact imported commit; global Figma drift is separately documented' -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
