name: Import approved Figma scenes
on:
  push:
    branches: [codex/import-figma-levels-01-09-20261017]
permissions:
  contents: write
  statuses: write
concurrency:
  group: figma-scene-import-candidate
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Compile only authenticated point edits
        run: node docs/design/figma-import-01-09/import-scene-points.mjs --write
      - name: Save generated files to the candidate branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scene-levels-data.js docs/design/scene-levels/figma-capture.json docs/design/scene-levels/specs/03-frozen-seed-wheel.json docs/design/scene-levels/specs/05-railway-depot.json docs/design/scene-levels/specs/07-living-root-vault.json docs/design/scene-levels/specs/08-magnetworks.json docs/design/scene-levels/specs/09-mycelium-sanctuary.json
          git rm .github/workflows/import-approved-scenes.yml
          git commit -m "Import approved Figma scene objectives through the checked compiler"
          git push origin HEAD:codex/import-figma-levels-01-09-20261017
          echo "TESTED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Full game regression suite
        id: tests
        run: npm test
      - name: Production build
        id: build
        if: always() && env.TESTED_SHA != ''
        run: npm run build
      - name: Record checks on the exact generated commit
        if: always() && env.TESTED_SHA != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_STATE: ${{ steps.tests.outcome == 'success' && steps.build.outcome == 'success' && 'success' || 'failure' }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${TESTED_SHA}" -f state="$CHECK_STATE" -f context='Figma import / full tests and build' -f description='npm test and npm run build on the generated candidate commit' -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
