name: Emergency static artifact
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - name: Publish minimal static tree to helper branch
        run: |
          mkdir -p /tmp/max-emergency
          cp dist/index.html dist/game-menu.js dist/run-results.js /tmp/max-emergency/
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout --orphan emergency-static
          git rm -rf .
          cp /tmp/max-emergency/* .
          git add index.html game-menu.js run-results.js
          git commit -m "Emergency static build from $GITHUB_SHA"
          git push --force origin HEAD:emergency-static
