name: Verify isolated Yeet sprites
on:
  push:
    branches: [fix/yeet-isolated-sprites]
    paths: [.github/workflows/yeet-isolation.yml]
permissions:
  contents: write
jobs:
  isolate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==12.3.0
      - run: npm ci
      - name: Isolate existing pixels and register the verified Figma masters
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json, hashlib
          pack=Path('assets/yeet-encounter-v1')
          source=Image.open(pack/'01-encounter.png').convert('RGBA')
          images={'yeet':Image.new('RGBA',(256,128)),'cat':Image.new('RGBA',(128,64))}
          palette=set()
          for row,srow in enumerate([0,1,3,7]):
           for col in range(8):
            cell=source.crop((col*32,srow*32,col*32+32,srow*32+32))
            points={(x,y) for y in range(32) for x in range(32) if cell.getpixel((x,y))[:3]!=(245,245,245) and cell.getpixel((x,y))[3]}
            groups=[]
            while points:
             todo=[points.pop()];g=set(todo)
             while todo:
              x,y=todo.pop()
              for dx in (-1,0,1):
               for dy in (-1,0,1):
                p=(x+dx,y+dy)
                if p in points:points.remove(p);g.add(p);todo.append(p)
             groups.append(g)
            groups.sort(key=len,reverse=True)
            if srow==1 and col==2:
             person={p for p in groups[0] if p[0]>=15};animal=groups[0]-person
            else:person,animal=groups[:2]
            assert len(person)>140 and 35<=len(animal)<=60
            for name,pts,dx,dy,size in [('yeet',person,-4,0,32),('cat',animal,-3,-16,16)]:
             for x,y in pts:
              px,py=x+dx,y+dy
              assert 0<=px<size and 0<=py<size
              rgba=cell.getpixel((x,y));assert rgba[3]==255
              images[name].putpixel((col*size+px,row*size+py),rgba)
              palette.add('#%02x%02x%02x'%rgba[:3])
          sheets={};frames={}
          pins={'yeet':('574:13527','8783ddf7b17f7387965f42c1cf977e573ffde224'),'cat':('582:13528','45ecb7f5fd293bdc3b487ca33f57536ed41dfb13')}
          entries=[]
          for name,size,anchor in [('yeet',32,[16,31]),('cat',16,[8,15])]:
           im=images[name];file=pack/(name+'.png');im.save(file,optimize=True)
           sha=hashlib.sha1(file.read_bytes()).hexdigest()
           assert sha==pins[name][1],(name,sha,'Figma hash mismatch')
           entries.append({'path':file.as_posix(),'nodeId':pins[name][0],'group':'enemies','width':im.width,'height':im.height,'sha1':sha})
           sheets[name]={'image':name+'.png','width':im.width,'height':im.height,'columns':8,'rows':4,'cell':size,'anchor':anchor}
           for i in range(32):
            x,y=i%8*size,i//8*size
            frames[f'{name}-{i}']={'sheet':name,'rect':[x,y,size,size],'opaqueBounds':list(im.crop((x,y,x+size,y+size)).getbbox())}
          atlas={'version':1,'source':{'nodeId':'527:13518','imageHash':'2a175fc79a0e2ae9a065cb82d0d4b4607e7d8d91','rows':[0,1,3,7]},'palette':sorted(palette),'sheets':sheets,'clips':{'idle':{'row':0,'fps':6,'count':8},'arrive':{'row':1,'fps':8,'count':8},'flash':{'row':2,'fps':8,'count':8},'flee':{'row':3,'fps':12,'count':8}},'frames':frames}
          (pack/'atlas.json').write_text(json.dumps(atlas,separators=(',',':'))+'\n')
          file=Path('assets/figma-manifest.json');text=file.read_text();manifest=json.loads(text)
          existing={e['path']:e for e in manifest['production']}
          for entry in entries:existing[entry['path']]=entry
          lines=['    { '+', '.join(json.dumps(k)+': '+json.dumps(v,ensure_ascii=False) for k,v in entry.items())+' }' for entry in sorted(existing.values(),key=lambda e:e['path'])]
          start=text.index('  "production": [\n')+len('  "production": [\n');end=text.index('\n  ],',start)
          file.write_text(text[:start]+',\n'.join(lines)+text[end:])
          (pack/'README.md').write_text('''# Yeet and the black cat

          These are isolated pixels from the existing Figma encounter sheet, node 527:13518, not new character drawings. The original workbench remains unchanged.

          `yeet.png` has 32 frames in 32 by 32 cells, anchor (16,31). `cat.png` has 32 frames in 16 by 16 cells, anchor (8,15). Draw both at native 1x with integer destinations and smoothing disabled. The cat is a separate actor with its own position, facing, animation clock and ground contact, replicated by the host.

          The four rows preserve source rows 0, 1, 3 and 7: idle, approach, beckon and escape. Source row 1 column 2 touches at the cat tail; the cat ends at x=14 and Yeet begins at x=15. Other frames separate by their disconnected silhouettes. All retained pixels keep their original colours. The flat #f5f5f5 export background is removed, with zero RGB under transparent pixels. Neither runtime sheet contains the other actor.

          `atlas.json` records every frame rectangle, opaque bound and source registration. The exact runtime PNG bytes are in Figma production nodes 574:13527 and 582:13528 and pinned by the canonical manifest.
          '''.replace('\n          ','\n'))
          (pack/'01-encounter.png').unlink()
          Path('.github/workflows/yeet-isolation.yml').unlink()
          print('64 isolated frames; both PNG hashes match their current Figma masters')
          PY
      - run: npm test
      - run: npm run build
      - name: Commit only the verified fix to its review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/yeet-encounter-v1 assets/figma-manifest.json .github/workflows/yeet-isolation.yml
          git commit -m 'Separate existing Yeet and cat sprites with verified native registration'
          git push origin HEAD:fix/yeet-isolated-sprites
          git rev-parse HEAD
