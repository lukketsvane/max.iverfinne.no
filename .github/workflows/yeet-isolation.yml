name: Verify isolated Yeet sprites
on:
  push:
    branches: [fix/yeet-isolated-sprites]
    paths: [.github/workflows/yeet-isolation.yml]
permissions:
  contents: write
jobs:
  isolate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==12.3.0
      - run: npm ci
      - name: Reuse the reviewed existing-pixel extraction
        run: |
          python - <<'PY'
          import subprocess, textwrap
          source = subprocess.check_output(['git', 'show', 'cf33add4ba7ee4bfef698d042ccb625636209275:.github/workflows/yeet-isolation.yml'], text=True)
          script = source.split("          python - <<'PY'\n", 1)[1].split('\n          PY', 1)[0]
          exec(textwrap.dedent(script))
          PY
      - run: node --test tests/yeet.test.cjs tests/figma-assets.test.cjs
      - run: npm run build
      - name: Commit the isolated sprite fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/yeet-encounter-v1 assets/figma-manifest.json .github/workflows/yeet-isolation.yml
          git commit -m 'Separate existing Yeet and cat sprites with verified native registration'
          git push origin HEAD:fix/yeet-isolated-sprites
          git rev-parse HEAD
