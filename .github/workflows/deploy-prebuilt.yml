name: Prebuilt production deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-prebuilt.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Link production project
        run: |
          mkdir -p .vercel
          printf '%s\n' '{"orgId":"team_6ukeAMsNaWMRhHombsc7EIwn","projectId":"prj_QU1gHXGoDr99H3MxAUcaXGx2wgMe"}' > .vercel/project.json
      - name: Pull production settings
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Build locally on GitHub
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Deploy prebuilt output to production
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
