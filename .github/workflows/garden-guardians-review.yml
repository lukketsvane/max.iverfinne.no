name: Garden guardians browser review
on:
  push:
    branches: [main, 'codex/**']
    paths:
      - 'index.html'
      - 'run-director.inc.js'
      - 'review.html'
      - 'native-art.mjs'
      - 'assets/garden-guardians-v1/**'
      - 'scripts/check-garden-guardians-browser.cjs'
      - '.github/workflows/garden-guardians-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guardians:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save playwright@latest
      - run: npx playwright install --with-deps webkit chromium
      - run: node scripts/check-garden-guardians-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: garden-guardians-browser-review
          path: guardian-browser-review/*.png
          if-no-files-found: ignore
