name: One-time merged branch cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-merged-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete branches already contained in main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          deleted=0
          kept=0
          while IFS= read -r ref; do
            branch="${ref#origin/}"
            [ "$branch" = "main" ] && continue
            if git merge-base --is-ancestor "origin/$branch" origin/main; then
              echo "DELETE $branch"
              git push origin --delete "$branch"
              deleted=$((deleted+1))
            else
              echo "KEEP   $branch (contains commits not in main)"
              kept=$((kept+1))
            fi
          done < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin | grep '^origin/' | sort)
          echo "Deleted $deleted merged branches; kept $kept divergent branches."
