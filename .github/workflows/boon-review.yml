name: Boon choices browser review
on:
  push:
    branches: [main, 'codex/**']
    paths:
      - 'index.html'
      - 'build-paths.js'
      - 'coop-game.inc.js'
      - 'review.html'
      - 'scripts/check-boon-browser.cjs'
      - '.github/workflows/boon-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save playwright@latest
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/check-boon-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boon-choices-review
          path: boon-browser-review/
