name: Verify live MAX FUGLESPRENGER
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-live.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify canonical source
        run: |
          set -euo pipefail
          curl -fsS --retry 6 --retry-delay 2 -D /tmp/headers https://max.iverfinne.no/ -o /tmp/page
          grep -qi '^x-max-source: github:lukketsvane/max.iverfinne.no@main' /tmp/headers
          grep -q '<title>MAX FUGLESPRENGER</title>' /tmp/page
          grep -q '#gameTitle,#blastHud,#gardenHud,#gardenHint,#roundHud{display:none!important}' /tmp/page
          echo "LIVE_CANONICAL_OK"
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@latest
          npx playwright install --with-deps chromium
      - name: iPhone 16e smoke test
        run: |
          cat > verify.cjs <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:390,height:844},hasTouch:true,isMobile:true,deviceScaleFactor:3});
            const page=await context.newPage(), errors=[];
            page.on('pageerror',e=>errors.push('PAGE '+e.message));
            page.on('console',m=>{if(m.type()==='error')errors.push('CONSOLE '+m.text())});
            const res=await page.goto('https://max.iverfinne.no/',{waitUntil:'domcontentloaded',timeout:120000});
            if(!res||res.status()!==200)throw new Error('HTTP '+(res&&res.status()));
            await page.waitForTimeout(2500);
            console.log('TITLE',await page.title());
            console.log('BODY',await page.evaluate(()=>document.body.innerText.slice(0,500)));
            console.log('MENU',await page.evaluate(()=>{const n=document.querySelector('.max-menu');return n&&{hidden:n.hidden,screen:n.dataset.screen,display:getComputedStyle(n).display,html:n.innerText.slice(0,300)}}));
            console.log('CANVAS',await page.evaluate(()=>{const c=document.querySelector('#c');return c&&{w:c.width,h:c.height,style:c.getAttribute('style')}}));
            await page.screenshot({path:'live-iphone.png',fullPage:true});
            if((await page.title())!=='MAX FUGLESPRENGER'&&(await page.title())!=='MAX · NIGHT GARDEN')throw new Error('wrong title');
            if(errors.length)throw new Error(errors.join('\n'));
            const menuVisible=await page.evaluate(()=>{const n=document.querySelector('.max-menu');return !!n&&!n.hidden&&getComputedStyle(n).display!=='none'&&n.innerText.includes('Play')});
            if(!menuVisible)throw new Error('main menu did not become visible');
            console.log('IPHONE_SMOKE_OK');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node verify.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-iphone-diagnostic
          path: live-iphone.png
          if-no-files-found: ignore
