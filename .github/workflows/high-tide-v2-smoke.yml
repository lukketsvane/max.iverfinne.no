name: High Tide v2 smoke
on:
  push:
    branches: ['high-tide-v2']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test tests/high-tide.test.cjs tests/high-tide-controls.test.cjs tests/results.test.cjs
      - run: npm run build
