name: Export megasheet source assets
on:
  push:
    branches: ['codex/megasheet-export']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: max-pixel-assets-source
          path: |
            assets/**/*.png
            docs/asset-review/raider-drone-v1/*.png
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
