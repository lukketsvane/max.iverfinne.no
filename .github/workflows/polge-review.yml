name: Pølge combat browser review
on:
  push:
    branches: [main, 'codex/**']
    paths:
      - 'index.html'
      - 'polge.inc.js'
      - 'coop-game.inc.js'
      - 'run-director.inc.js'
      - 'high-tide.inc.js'
      - 'last-seed.inc.js'
      - 'rat-enemies.inc.js'
      - 'max-classes.js'
      - 'native-art.mjs'
      - 'assets/max-skins-v1/polge/**'
      - 'review.html'
      - 'build-paths.js'
      - 'scripts/check-polge-browser.cjs'
      - '.github/workflows/polge-review.yml'
permissions:
  contents: read
jobs:
  boxing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save playwright@latest
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/check-polge-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polge-combat-review
          path: polge-browser-review/
