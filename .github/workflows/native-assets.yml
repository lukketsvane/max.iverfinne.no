name: Native asset contract
on:
  push:
    branches: [fix/native-sprite-contract]
    paths: ['.github/workflows/native-assets.yml', 'scripts/native-assets/**', 'assets/native/**', 'tests/native-assets*', 'index.html']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export original embedded images and source snapshot
        run: |
          python3 - <<'PY'
          import re, base64, struct, json, pathlib, shutil
          root=pathlib.Path('.')
          out=root/'native-audit'
          out.mkdir(exist_ok=True)
          text=(root/'index.html').read_text()
          records=[]
          for i,m in enumerate(re.finditer(r'data:image/png;base64,([A-Za-z0-9+/=]+)',text)):
              raw=base64.b64decode(m.group(1))
              w,h=struct.unpack('>II',raw[16:24])
              name='embedded-%02d-%dx%d.png'%(i,w,h)
              (out/name).write_bytes(raw)
              records.append({'file':name,'width':w,'height':h,'line':text[:m.start()].count('\n')+1,'context':text[max(0,m.start()-100):m.start()]})
          (out/'embedded.json').write_text(json.dumps(records,indent=2))
          for name in ['index.html','run-results.js','run-results.css','package.json','README.md']:
              shutil.copy2(root/name,out/name)
          shutil.copytree(root/'tests',out/'tests',dirs_exist_ok=True)
          print(json.dumps(records,indent=2))
          PY
      - name: Game regression tests
        run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: native-sprite-audit
          path: native-audit/
          retention-days: 7
