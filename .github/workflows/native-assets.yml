name: Native asset contract
on:
  push:
    branches: [fix/native-sprite-contract]
    paths: ['.github/workflows/native-assets.yml', 'scripts/**', 'assets/native/**', 'tests/native-assets*', 'native-assets.html', 'index.html']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test committed files before regeneration
        run: npm test
      - name: Install pixel build dependency
        run: python3 -m pip install Pillow
      - name: Verify source, reproduce pixels and metadata, export individual frames
        run: |
          python3 - <<'PY'
          import json, pathlib, hashlib, runpy
          from PIL import Image
          root=pathlib.Path('.')
          base=root/'assets/native'
          names=['rover','water-fx','props','ui']
          report=json.loads((base/'validation.json').read_text())
          assert hashlib.sha256((root/'index.html').read_bytes()).hexdigest()==report['sourceFileSHA256'], 'Original game changed'
          pixels={n:Image.open(base/(n+'.png')).convert('RGBA').tobytes() for n in names}
          metadata={n:json.loads((base/(n+'.json')).read_text()) for n in names}
          runpy.run_path(str(root/'scripts/native-assets/build.py'),run_name='__main__')
          for n in names:
              assert pixels[n]==Image.open(base/(n+'.png')).convert('RGBA').tobytes(), 'Pixel mismatch: '+n
              assert metadata[n]==json.loads((base/(n+'.json')).read_text()), 'Metadata mismatch: '+n
          print('All four committed atlases reproduced exactly; 80 individual frames exported.')
          PY
      - name: Build static preview
        run: npm run build
      - name: Export runnable kit and source
        run: |
          mkdir -p native-kit/scripts/native-assets native-kit/tests
          cp index.html run-results.js run-results.css package.json native-assets.html native-kit/
          cp -R assets native-kit/
          cp scripts/native-assets/build.py native-kit/scripts/native-assets/
          cp scripts/build-static.cjs native-kit/scripts/
          cp tests/*.cjs native-kit/tests/
      - uses: actions/upload-artifact@v4
        with:
          name: renderer-matched-native-kit
          path: native-kit/
          retention-days: 14
