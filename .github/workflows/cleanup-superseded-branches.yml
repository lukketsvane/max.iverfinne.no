name: One-time superseded branch cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-superseded-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete reviewed superseded branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "asset/github-megasheet-20260922"
            "codex/native-pixel-assets"
            "codex/unused-sheet-export"
            "fix/native-sprite-contract"
            "gameplay/harder-gardens"
            "gameplay/rat-enemies"
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              echo "DELETE $branch"
              git push origin --delete "$branch"
            else
              echo "SKIP $branch (already absent)"
            fi
          done
