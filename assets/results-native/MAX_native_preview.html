function drawRootAsset(r, sx, gy, flip) {
  if (!plantAtlasReady || !r) return;
  var w=r[2], h=r[3];
  ctx.save();
  ctx.translate(Math.round(sx), Math.round(gy+2));
  if (flip) ctx.scale(-1,1);
  ctx.globalAlpha=0.76;
  ctx.drawImage(plantAtlas,r[0],r[1],w,h,-(w>>1),0,w,h);
  ctx.restore(); ctx.globalAlpha=1;
}

function drawSeedAsset(r, sx, sy) {
  if (!plantAtlasReady || !r) return;
  ctx.drawImage(plantAtlas,r[0],r[1],r[2],r[3],Math.round(sx-r[2]/2),Math.round(sy),r[2],r[3]);
}

function figmaSeg(r, cx, yb, flip) {
  var dx = cx - (r[2] >> 1), dy = yb - r[3];
  if (flip) {
    ctx.save(); ctx.translate(dx + r[2], dy); ctx.scale(-1, 1);
    ctx.drawImage(plantAtlas, r[0], r[1], r[2], r[3], 0, 0, r[2], r[3]);
    ctx.restore();
  } else ctx.drawImage(plantAtlas, r[0], r[1], r[2], r[3], dx, dy, r[2], r[3]);
}

function plantHeight(p){

</script><script>/* Native 1x bouquet compositor. No generated concept image is used as a sprite.
 * Supply the game's existing drawResultPlant callback; records are rogueRun.garden.
 * Every plant is retained. Long runs produce additional bundles of 24 plants.
 */
(function(root){
'use strict';
var W=96,H=96,AX=48,AY=91,CAPACITY=24;
var SWAY=[0,1,2,1,0,-1,-2,-1];
var ROPE=['#261e18','#6d5141','#9d925b','#d7bf69'];

function chunks(plants,capacity){
  if(!Array.isArray(plants))throw new TypeError('plants must be the saved plant array');
  capacity=Math.max(1,Math.min(CAPACITY,Math.floor(capacity||CAPACITY)));
  var out=[];
  for(var i=0;i<plants.length;i+=capacity)out.push(plants.slice(i,i+capacity));
  return out.length?out:[[]];
}

function rope(ctx,cx,y,width){
  width=width||13;var x=cx-Math.floor(width/2);
  ctx.fillStyle=ROPE[0];ctx.fillRect(x,y,width,5);
  ctx.fillStyle=ROPE[1];ctx.fillRect(x+1,y+1,width-2,3);
  ctx.fillStyle=ROPE[2];ctx.fillRect(x+1,y+1,width-2,1);ctx.fillRect(x+2,y+3,width-4,1);
  ctx.fillStyle=ROPE[3];ctx.fillRect(cx-1,y+1,2,1);
  ctx.fillStyle=ROPE[0];ctx.fillRect(cx,y+2,2,2);
}

function render(canvas,plants,options){
  options=options||{};
  if(typeof options.drawPlant!=='function')throw new TypeError('drawPlant callback is required');
  var groups=chunks(plants,options.capacity);
  var page=Math.max(0,Math.min(groups.length-1,Math.floor(options.bundle||0)));
  var group=groups[page],frame=((Math.floor(options.frame||0)%8)+8)%8;
  canvas.width=W;canvas.height=H;
  var ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,W,H);
  if(!group.length){
    ctx.fillStyle='#5f633c';ctx.fillRect(47,88,3,2);
    ctx.fillStyle='#d9c760';ctx.fillRect(48,87,2,2);
    return {bundle:page,bundleCount:groups.length,plantCount:0,visibleIds:[],anchor:[AX,AY]};
  }
  var stamp=canvas.ownerDocument.createElement('canvas');stamp.width=64;stamp.height=96;
  // Draw the outer stems first, centre stems last; all frame data retain their IDs.
  var placement=group.map(function(record,i){
    var u=group.length===1?0:(i/(group.length-1)*2-1);
    return {record:record,index:i,spread:Math.round(u*Math.min(20,4+group.length))};
  }).sort(function(a,b){return Math.abs(b.spread)-Math.abs(a.spread)||a.index-b.index;});
  placement.forEach(function(item){
    var sp=stamp.getContext('2d');sp.setTransform(1,0,0,1,0,0);sp.clearRect(0,0,64,96);
    // Extra headroom protects flower heads extending above the old result canvas.
    sp.translate(0,12);options.drawPlant(stamp,item.record);sp.setTransform(1,0,0,1,0,0);
    // Scanline shearing uses whole-pixel translations. Never scale or rotate a leaf.
    // Rows >=78 contain the old result baseline/roots and are intentionally excluded.
    for(var sy=0;sy<78;sy++){
      var q=Math.min(1,(77-sy)/65);
      var dx=AX-32+Math.round(item.spread*q+SWAY[frame]*q*q);
      ctx.drawImage(stamp,0,sy,64,1,dx,2+sy,64,1);
    }
    // The bundle's gathered stem ends meet a common, frame-stable grounding anchor.
    var end=Math.round(item.spread*.22),start=Math.round(item.spread*.07);
    for(var y=78;y<AY;y++){
      var k=(y-78)/(AY-79),x=AX+Math.round(start+(end-start)*k);
      ctx.fillStyle='#183427';ctx.fillRect(x,y,1,1);
      ctx.fillStyle='#0e1e1d';ctx.fillRect(x+1,y,1,1);
    }
  });
  rope(ctx,AX,76,group.length>16?17:13);
  return {bundle:page,bundleCount:groups.length,plantCount:plants.length,
    visibleIds:group.map(function(p){return p.id;}),anchor:[AX,AY]};
}

root.MaxBouquet={render:render,chunks:chunks,drawTie:rope,
  frame:{w:W,h:H},anchor:{x:AX,y:AY},capacity:CAPACITY,
  animation:{frames:8,durationMs:120,loop:true}};
})(typeof window!=='undefined'?window:this);

const art=document.getElementById('art'),live=document.getElementById('live'),zoom=document.getElementById('zoom'),caption=document.getElementById('caption'),controls=document.getElementById('liveControls');
let mode='gameover',plants=samples['bundle-12'],page=0,animated=true,frame=0,renderer;
const atlas=new Image();atlas.src=assets.atlas;
atlas.onload=()=>{renderer=MaxPlantNative.create(atlas);draw();};
const sizes={gameover:[150,324],leaderboard:[150,324],scale:[300,140],sprites:[384,192],live:[96,96]};
const notes={gameover:'150 × 324 native pixels. Every displayed pixel is enlarged by a whole number.',leaderboard:'The same leaf and flower pixels are used for every player. Your bouquet is highlighted.',scale:'Original player and crow, two actual game plants, and a new bundle at the same native scale.',sprites:'Eight example bundles. Each frame is 96 × 96 native pixels with a shared grounding anchor.',live:'Each saved plant is retained. Longer runs have additional bundles. Upload JSON to use your actual run.'};
function show(){
 const z=Number(zoom.value),[w,h]=sizes[mode];
 art.style.display=mode==='live'?'none':'block';live.style.display=mode==='live'?'block':'none';controls.style.display=mode==='live'?'flex':'none';
 const el=mode==='live'?live:art;el.style.width=(w*z)+'px';el.style.height=(h*z)+'px';
 if(mode!=='live')art.src=assets[mode];caption.textContent=notes[mode];
 document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));draw();
}
function draw(){
 if(!renderer)return;
 const result=MaxBouquet.render(live,plants,{drawPlant:(c,p)=>renderer.drawPlant(c,p,0),bundle:page,frame:animated?frame:0});
 document.getElementById('prev').disabled=page<=0;document.getElementById('next').disabled=page>=result.bundleCount-1;
 const dots=document.getElementById('pageDots');
 if(dots.children.length!==result.bundleCount){dots.replaceChildren();for(let i=0;i<result.bundleCount;i++)dots.append(document.createElement('i'));}
 Array.from(dots.children).forEach((d,i)=>d.className=i===page?'current':'');
}
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;show();}));zoom.addEventListener('change',show);
document.getElementById('sample').addEventListener('change',e=>{plants=samples[e.target.value];page=0;draw();});
document.getElementById('prev').addEventListener('click',()=>{page=Math.max(0,page-1);draw();});
document.getElementById('next').addEventListener('click',()=>{page=Math.min(MaxBouquet.chunks(plants).length-1,page+1);draw();});
document.getElementById('motion').addEventListener('click',e=>{animated=!animated;e.target.setAttribute('aria-pressed',String(animated));draw();});
document.getElementById('export').addEventListener('click',()=>{live.toBlob(blob=>{const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='my-bouquet-native.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);},'image/png');});
document.getElementById('records').addEventListener('change',async e=>{
 try{const file=e.target.files[0];if(!file)return;const raw=JSON.parse(await file.text());const list=Array.isArray(raw)?raw:(raw.rogue?.garden||raw.garden||raw.plants);
 if(!Array.isArray(list)||list.some(p=>!p||![p.kind,p.seed,p.growth].every(Number.isFinite)))throw Error('Expected saved plants with kind, seed and growth.');
 plants=list;page=0;draw();caption.textContent='Your saved plants are loaded. All bundles are available.';
 }catch(err){caption.textContent=err.message;}
});
setInterval(()=>{if(mode==='live'&&animated){frame=(frame+1)%8;draw();}},120);show();
