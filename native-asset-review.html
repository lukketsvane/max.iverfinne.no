<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAX · native asset review</title>
<style>html{font:14px system-ui;background:#111616;color:#d2d8c8}body{max-width:1150px;margin:20px auto;padding:0 16px}h1{font-size:22px}p{color:#9faa9c;max-width:70ch}main{display:flex;gap:24px;flex-wrap:wrap}iframe{width:390px;height:700px;border:1px solid #465349;background:#0d0909}section{min-width:250px;flex:1}select,button{background:#202922;color:#d2d8c8;border:1px solid #465349;padding:10px;margin:3px}canvas{display:block;image-rendering:pixelated;background:#353d36;margin:12px 0;max-width:100%}a{color:#b6cba2}label{display:block;margin:12px 0}code{font-size:12px}#meta{white-space:pre-wrap;font:12px/1.5 monospace}</style>
<h1>MAX · native pixel assets</h1><p>Left: the actual game renderer, with isolated in-memory saves. Right: raw frames at integer zoom. The game artwork and its display zoom are unchanged.</p>
<main><iframe id="game" title="Actual MAX renderer with new native sprites" src="assets/native/game-review.html"></iframe><section>
<label>Robot <select id="robot"><option>water</option><option>idle</option><option>drive</option><option>deploy</option><option>retract</option><option>empty</option><option>refill</option><option>sleep</option></select></label>
<label>Drone <select id="drone"><option>carry</option><option>hover</option><option>approach</option><option>brake</option><option>lower_claw</option><option>grip</option><option>lift</option><option>release</option></select></label>
<label>Sheet <select id="sheet"></select></label><label>Sequence <select id="state"></select></label><label>Zoom <select id="zoom"><option>1</option><option>2</option><option selected>4</option><option>8</option></select></label>
<canvas id="frame" width="64" height="48"></canvas><div id="meta"></div><p><a href="assets/native/README.md">Frame contracts and developer notes</a></p></section></main>
<script src="native-sprites.js"></script><script>
(async function(){var m=await(await fetch('assets/native/manifest.json')).json();await MaxNativeSprites.load();var sheet=document.getElementById('sheet'),state=document.getElementById('state'),zoom=document.getElementById('zoom'),cv=document.getElementById('frame'),start=performance.now();
for(var k of Object.keys(m.sheets)){var o=document.createElement('option');o.textContent=k;sheet.appendChild(o);}function options(){state.replaceChildren();for(var a of m.sheets[sheet.value].animations){var o=document.createElement('option');o.textContent=a;state.appendChild(o);}start=performance.now();}sheet.onchange=options;state.onchange=function(){start=performance.now();};options();
for(var id of ['robot','drone'])document.getElementById(id).onchange=function(){document.getElementById('game').contentWindow.postMessage({type:'native-animation',actor:this.id,state:this.value},location.origin);};
function render(){var t=(performance.now()-start)/1000,r=MaxNativeSprites.resolve(sheet.value,state.value,t),e=r.entry;if(cv.width!==e.frame.w)cv.width=e.frame.w;if(cv.height!==e.frame.h)cv.height=e.frame.h;var c=cv.getContext('2d');c.clearRect(0,0,cv.width,cv.height);MaxNativeSprites.draw(c,sheet.value,state.value,t,e.origin.x,e.origin.y);cv.style.width=cv.width*Number(zoom.value)+'px';cv.style.height=cv.height*Number(zoom.value)+'px';document.getElementById('meta').textContent=r.id+'\nCell '+e.frame.w+' × '+e.frame.h+' px\nVisible '+e.bounds.w+' × '+e.bounds.h+' px\nOrigin '+e.origin.x+', '+e.origin.y+'\n'+JSON.stringify(e.sockets);requestAnimationFrame(render);}render();})();
</script></html>
