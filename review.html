<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAX · visual review</title>
<style>body{margin:20px;background:#111;color:#eee;font:14px monospace}nav{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}button{padding:12px;background:#253026;color:#eee;border:1px solid #889279}iframe{display:block;border:1px solid #444;max-width:100%;background:#111}p{max-width:70em;line-height:1.6}</style>
<h1>MAX · visual review</h1><p>Isolated fixtures using the actual game renderer. These sample gardens do not read or change your saves.</p>
<nav><button data-mode="menu">Main menu</button><button data-mode="controls">Controls</button><button data-mode="combat">Combat</button><button data-mode="results">Bouquet</button><button data-mode="empty">Empty garden</button><button data-mode="many">Three bouquets</button><button data-mode="robot0">Small robot</button><button data-mode="robot1">First upgrade</button><button data-mode="robot2">Second upgrade</button><button id="rotate">Portrait / landscape</button></nav><p id="status">Loading…</p><iframe title="Game preview" width="1000" height="650" sandbox="allow-scripts allow-same-origin"></iframe>
<script>
(async function(){
 const source=await fetch('index.html').then(r=>r.text()), frame=document.querySelector('iframe'),status=document.getElementById('status');
 let current='results';
 function show(mode){
  current=mode;status.textContent='Fixture: '+mode;
  const count=mode==='empty'?0:mode==='many'?53:(mode==='controls'||mode==='combat')?2:12;
  const menu=mode==='menu',robot=mode.startsWith('robot')||mode==='controls'||mode==='combat',tier=mode.startsWith('robot')?Number(mode.at(-1)):0;
  const setup=`
    const fixtureStorage=new Map();const localStorage={getItem:k=>fixtureStorage.get(k)||null,setItem:(k,v)=>fixtureStorage.set(k,String(v)),removeItem:k=>fixtureStorage.delete(k)};
  `;
  const hook=`
    menuPaused=false;rogueRun.next=1000000000;rogueRun.ended=false;rogueRun.choice=null;rogueRun.perks.robot=${tier};
    companion=null;P.x=0;P.y=surfaceY(0);P.vx=0;P.face=1;gardenSeeds=3;
    gardenPlots=[];rogueRun.garden=[];
    for(var q=0;q<${count};q++){var p={id:q+1,x:24+q*28,kind:q%9,seed:79+q*23.7,growth:1.05+(q%6)*.22,stalk:false,health:1,moisture:.14,pulse:0,hit:0,age:0};gardenPlots.push(p);recordGardenPlant(p);}
    ensureCompanion();gardenRaidT=9999;krekSpawnT=9999;gardenRaidActive=false;
    if(${mode==='combat'}){gardenPlots.forEach(function(p,i){p.moisture=.8;var k=makeKrek(1,false);k.x=p.x+8;k.y=surfaceY(p.x)-18;k.vx=k.vy=0;k.kind=i;k.target=p;k.bite=.4;floatKrek.push(k);});}

    if(!${robot}&&!${menu}){rogueRun.ended=true;showRunResult();}
  `;
  let html=source.replace('<head>','<head><base href="'+location.href.replace(/review.html.*$/,'')+'">')
   .replace('<script src="game-menu.js" defer><'+'/script>',menu?'<script src="game-menu-review.js" defer><'+'/script>':'')
   .replaceAll('window.localStorage','localStorage')
   .replace('"use strict";','"use strict";'+setup)
   .replace(/\}\)\(\);\s*<\/script>/g,hook+'})();<'+'/script>');
  frame.srcdoc=html;
 }
 document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>show(b.dataset.mode));
 document.getElementById('rotate').onclick=()=>{const portrait=frame.width!=='390';frame.width=portrait?'390':'1000';frame.height=portrait?'844':'650';show(current);};
 show(current);
})();
</script></html>
