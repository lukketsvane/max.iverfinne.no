<!doctype html><html lang="nn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>High Tide playtest</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:12px;background:#101315;color:#d9dfcd;font:13px/1.5 monospace}h1{font-size:18px;margin:0}p{margin:5px 0 10px}button,select{font:inherit;color:inherit;background:#26372d;border:1px solid #718875;padding:8px;min-height:38px}button[aria-pressed=true]{background:#677943;color:white}.controls{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}label{display:inline-flex;gap:6px;align-items:center}.players{display:flex;gap:12px;flex-wrap:wrap}.player{width:390px}iframe{display:block;width:390px;height:650px;border:0;max-width:100%}.status{min-height:65px;font-size:11px;white-space:pre-wrap}.input{display:flex;gap:4px;flex-wrap:wrap}.input button{padding:5px;min-width:38px}#log{max-width:800px;font-size:11px}
</style>
<h1>High Tide · speltest</h1><p>To isolerte klientar. Vanleg spelmotor og input. Ingen konto eller lagring.</p>
<div class="controls"><label>Spelarar<select id="count"><option value="1">1</option><option value="2" selected>2</option></select></label><label>Første<select id="first"><option>mech</option><option>runner</option><option>bulwark</option><option>herbalist</option><option>polge</option><option>sligo</option></select></label><label>Andre<select id="second"><option>herbalist</option><option>runner</option><option>bulwark</option><option>polge</option><option>sligo</option><option>mech</option></select></label><label>Nivå<select id="difficulty"><option>easy</option><option selected>medium</option><option>hard</option><option>insane</option></select></label><label>Input<select id="style"><option value="manual">Manuell</option><option value="explore">Utforskingspilot</option><option value="vine">Stengelpilot</option><option value="split" selected>Utforskar + steller</option></select></label><button id="reset">Ny runde</button><button id="play">Spel</button><button id="pause">Pause</button></div>
<div class="players" id="players"></div><pre id="log"></pre>
<script>
(async()=>{
 const source=await fetch('index.html').then(r=>r.text()),graph=await fetch('high-tide-playtest-routes.json').then(r=>r.json()),root=document.querySelector('#players');
 const ids=['11111111-1111-4111-8111-111111111111','22222222-2222-4222-8222-222222222222'];
 let frames=[],serial=0,latest=[],playing=false;
 const send=(i,data)=>frames[i]?.contentWindow.postMessage({...data,serial},location.origin);
 function reset(){
  serial++;playing=false;latest=[];root.replaceChildren();frames=[];document.querySelector('#log').textContent='';
  const count=+document.querySelector('#count').value,classes=[document.querySelector('#first').value,document.querySelector('#second').value],difficulty=document.querySelector('#difficulty').value,style=document.querySelector('#style').value;
  if(count===2&&classes[0]===classes[1]){document.querySelector('#log').textContent='Vel to ulike klassar.';return;}
  const room={host:ids[0],mode:'high-tide',members:classes.slice(0,count).map((classId,i)=>({id:ids[i],slot:i+1,name:i?'TEST 2':'TEST 1',classId,skin:({mech:'tide',runner:'moss',bulwark:'ember',herbalist:'moon',polge:'polge',sligo:'sligo'})[classId],difficulty}))};
  for(let i=0;i<count;i++){
   const panel=document.createElement('section');panel.className='player';panel.innerHTML='<strong>Spelar '+(i+1)+' · '+classes[i]+'</strong><div class="input"></div><div class="status">Lastar…</div>';
   const inputs=panel.querySelector('.input'),keys=[['Venstre','ArrowLeft'],['Høgre','ArrowRight'],['Hopp','ArrowUp'],['Stell',' '],['Skyt','fire'],['Evne','e'],['1','1'],['2','2'],['3','3']];
   keys.forEach(([label,key])=>{const b=document.createElement('button');b.textContent=label;b.setAttribute('aria-label','P'+(i+1)+' '+label);b.setAttribute('aria-pressed','false');inputs.append(b);b.onclick=()=>{const toggle=['ArrowLeft','ArrowRight',' ','fire'].includes(key),down=toggle?b.getAttribute('aria-pressed')!=='true':true;b.setAttribute('aria-pressed',String(toggle&&down));send(i,{type:'input',key,down});if(!toggle)setTimeout(()=>send(i,{type:'input',key,down:false}),200);};});
   const f=document.createElement('iframe');f.title='Spelar '+(i+1);f.setAttribute('sandbox','allow-scripts allow-same-origin');panel.append(f);root.append(panel);frames.push(f);
   const setup='<script src="high-tide-playtest-pilot.js"><'+'/script><script>(function(){const entries=new Map();Object.defineProperty(window,"localStorage",{value:{getItem:k=>entries.get(k)||null,setItem:(k,v)=>entries.set(k,String(v)),removeItem:k=>entries.delete(k),clear:()=>entries.clear()},configurable:false});})();<'+'/script>';
   const hook=`
    const serial=${serial},slot=${i},reviewRoom=${JSON.stringify(room)},reviewGraph=${JSON.stringify(graph)},reviewOrigin=${JSON.stringify(location.origin)};
    let running=false,auto=${JSON.stringify(style!=='manual')},manualFire=false,networkAt=-1000,packetId=0,pending=[],stateAt=-1000,pilotTime=0;
    const send=(type,data)=>parent.postMessage({type,serial,slot,...data},reviewOrigin);
    if(${count}>1)beginCoop({room:reviewRoom,user:{id:reviewRoom.members[slot].id},host:slot===0,
     action(type,data){pending.push(Object.assign({},data,{type,id:++packetId}));return true;},
     tick(avatar,capture){if(!running||performance.now()-networkAt<66)return;networkAt=performance.now();send('wire',{packet:slot?{avatar,actions:pending}:capture(),kind:slot?'input':'state'});}
    });else resetRogueRun('PLAYTEST',{mode:'high-tide',classId:reviewRoom.members[0].classId,skinId:reviewRoom.members[0].skin,difficulty:reviewRoom.members[0].difficulty});
    menuPaused=true;clearRunInput();
    const api={highTidePlant,highTideRoutePoint,highTideBoons,highTidePods,seedVital,seedActors,HIGH_TIDE_GATES};
    ${['P','rogueRun','floatKrek','runHazards'].map(n=>`Object.defineProperty(api,'${n}',{get:()=>${n}});`).join('')}
    const key=(type,key)=>window.dispatchEvent(new KeyboardEvent(type,{key,bubbles:true,cancelable:true}));
    const pilot=createHighTidePilot(api,key,reviewGraph,{style:${JSON.stringify(style==='split'?(i?'vine':'explore'):style)}});
    window.addEventListener('message',event=>{if(event.source!==parent||event.origin!==reviewOrigin||event.data.serial!==serial)return;const d=event.data;
     if(d.type==='pause'){running=false;menuPaused=true;pilot.stop();clearRunInput();}
     if(d.type==='play'){running=true;menuPaused=false;}
     if(d.type==='input'){auto=false;pilot.stop();if(d.key==='fire')manualFire=d.down;else key(d.down?'keydown':'keyup',d.key);}
     if(d.type==='wire'){if(d.kind==='input')coopInput(reviewRoom.members[1].id,d.packet);else{coopState(d.packet);pending=pending.filter(a=>a.id>(d.packet.acks[reviewRoom.members[slot].id]||0));}}
    });
    const originalFrame=frame;let previous=performance.now(),fireHeld=false;
    frame=function(now){const dt=Math.max(0,Math.min(.05,(now-previous)/1000));previous=now;
     if(running&&!rogueRun.ended){if(auto)pilot.tick(dt);else if(manualFire){pilotTime+=dt;const on=pilotTime%.64<.14;if(on!==fireHeld){fireHeld=on;key(on?'keydown':'keyup','b');}}else if(fireHeld){fireHeld=false;key('keyup','b');}}
     originalFrame(now);
     if(now-stateAt>250){stateAt=now;const s=rogueRun.survival,p=highTidePlant();send('state',{state:{ready:ready(highTideLayout().art.img),running,auto,ended:rogueRun.ended,won:runWon,time:Math.round(s.elapsed),bosses:s.bosses,plantHeight:Math.round(s.height),height:Math.round(s.base-P.y),x:Math.round(P.x),motion:P.st,peers:seedActors().map(a=>({id:a.id,x:a.p.x,y:a.p.y,hp:a.v.hp})),hp:Math.round(seedVital().hp),water:p?Math.round(p.moisture*100):0,plant:p?Math.round(p.health*100):0,boons:s.boonMask,dew:s.dewMask,phase:pilot.phase,metrics:pilot.metrics}});}
    };
   `;
   f.srcdoc=source.replace('<head>','<head><base href="'+location.href.replace(/playtest(?:\.html)?.*$/,'')+'">'+setup).replace('<script src="game-menu.js" defer><'+'/script>','').replace('start();\n})();','start();\n'+hook+'})();');
  }
 }
 window.addEventListener('message',event=>{
  const d=event.data;if(event.origin!==location.origin||d.serial!==serial||event.source!==frames[d.slot]?.contentWindow)return;
  if(d.type==='wire'){const target=d.slot?0:1;setTimeout(()=>send(target,d),100);}
  if(d.type==='state'){
   latest[d.slot]=d.state;const n=frames[d.slot].parentElement.querySelector('.status');n.dataset.state=JSON.stringify(d.state);n.textContent=d.state.ready?[d.state.won?'SIGER':d.state.ended?'SLUTT':d.state.running?'SPELAR':'PAUSE',d.state.time+' s · '+d.state.bosses+'/5 · '+d.state.height+' px · x '+d.state.x,'Helse '+d.state.hp+' · plante '+d.state.plant+' · vatn '+d.state.water+' · '+(d.state.auto?d.state.phase:'manuell')].join('\n'):'Lastar…';
   if(latest[0]?.ended){playing=false;document.querySelector('#log').textContent=JSON.stringify(latest.map(s=>s.metrics),null,2);}
  }
 });
 document.querySelector('#reset').onclick=reset;
 document.querySelector('#play').onclick=()=>{playing=true;frames.forEach((_,i)=>send(i,{type:'play'}));};
 document.querySelector('#pause').onclick=()=>{playing=false;frames.forEach((_,i)=>send(i,{type:'pause'}));};
 reset();
})();
</script></html>
